name: Attestation Conformance

on:
  pull_request:
    paths:
      - "src/attestation.rs"
      - "test-vectors/conformance/verify-attestation.mjs"
      - ".github/workflows/attestation-conformance.yml"
  push:
    branches: [main]
    paths:
      - "src/attestation.rs"
      - "test-vectors/conformance/verify-attestation.mjs"
      - ".github/workflows/attestation-conformance.yml"

permissions:
  contents: read

jobs:
  independent-node:
    name: Independent Node attestation verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconstruct and verify canonical attestation vectors
        run: node test-vectors/conformance/verify-attestation.mjs
