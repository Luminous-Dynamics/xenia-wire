name: Apply causal authority clippy repair

on:
  push:
    branches:
      - causal-authority-ci-repair-v1

permissions: {}

concurrency:
  group: xenia-wire-causal-authority-clippy-repair-v2
  cancel-in-progress: true

env:
  CONSTRUCTOR_SOURCE_SHA: ${{ github.sha }}
  TARGET_BASE_SHA: 2dc39ad7c2ec00755212cac616cdab5e6835a525
  CLEAN_REVIEW_HEAD_SHA: a846cd2e636db91b67a9020d3f9892d93fd6c095
  CANDIDATE_BRANCH: causal-authority-ci-repair-v1-clean-candidate

jobs:
  construct:
    name: Read-only bounded source repair and qualification
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CONSTRUCTOR_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: clippy, rustfmt

      - name: Assert exact repair lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONSTRUCTOR_SOURCE_SHA"
          test -z "$(git status --porcelain)"

          git fetch --no-tags origin "$TARGET_BASE_SHA" "$CLEAN_REVIEW_HEAD_SHA"
          test "$(git rev-parse "$CLEAN_REVIEW_HEAD_SHA^")" = "$TARGET_BASE_SHA"
          test "$(git rev-list --count "$TARGET_BASE_SHA..$CLEAN_REVIEW_HEAD_SHA")" = 1

          # Construction scaffolding must not have altered the authority source
          # we intend to repair. The exact clean review head is the source-tree
          # authority for every file except the bounded three-lint replacement.
          test "$(git rev-parse "$CONSTRUCTOR_SOURCE_SHA:src/authority.rs")" = \
            "$(git rev-parse "$CLEAN_REVIEW_HEAD_SHA:src/authority.rs")"

      - name: Apply bounded source transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/patches/repair_causal_authority_clippy_v1.py
          rustfmt --edition 2024 src/authority.rs
          git diff --check

      - name: Verify exact source diff and replacements
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          test "${#paths[@]}" = 1
          test "${paths[0]}" = "src/authority.rs"

          grep -q 'reason.len() > MAX_AUTHORITY_RESPONSE_REASON_BYTES' src/authority.rs
          grep -q 'self.core.reason.len() > MAX_AUTHORITY_RESPONSE_REASON_BYTES' src/authority.rs
          grep -q 'request.core.reason.len() > MAX_AUTHORITY_REQUEST_REASON_BYTES' src/authority.rs
          ! grep -q 'reason.as_bytes().len() > MAX_AUTHORITY_RESPONSE_REASON_BYTES' src/authority.rs
          ! grep -q 'self.core.reason.as_bytes().len() > MAX_AUTHORITY_RESPONSE_REASON_BYTES' src/authority.rs
          ! grep -q 'request.core.reason.as_bytes().len() > MAX_AUTHORITY_REQUEST_REASON_BYTES' src/authority.rs
          cargo fmt --check

      - name: Freeze dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git check-ignore -q Cargo.lock
          mkdir -p "$RUNNER_TEMP/causal-authority-repair-capsule"
          cp Cargo.lock "$RUNNER_TEMP/causal-authority-repair-capsule/Cargo.lock"

      - name: Clippy causal-authority boundary
        run: cargo clippy --locked --no-default-features --features causal-authority --all-targets -- -D warnings

      - name: Clippy authority handshake boundary
        run: cargo clippy --locked --no-default-features --features causal-authority,handshake --all-targets -- -D warnings

      - name: Clippy all-features integration surface
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

      - name: Focused causal-authority vector regression
        run: cargo test --locked --no-default-features --features causal-authority --test causal_authority_vectors

      - name: Focused authority handshake library regressions
        run: cargo test --locked --no-default-features --features causal-authority,handshake --lib

      - name: Seal repaired source capsule
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          test "${#paths[@]}" = 1
          test "${paths[0]}" = "src/authority.rs"
          git diff --check
          test -z "$(git diff --name-only --cached)"

          OUT="$RUNNER_TEMP/causal-authority-repair-capsule"
          cp src/authority.rs "$OUT/authority.rs"

          {
            echo 'profile=xenia-wire-causal-authority-clippy-repair-v2'
            echo "constructor_source=$CONSTRUCTOR_SOURCE_SHA"
            echo "constructor_tree=$(git rev-parse "$CONSTRUCTOR_SOURCE_SHA^{tree}")"
            echo "constructor_workflow_sha256=$({ git show "$CONSTRUCTOR_SOURCE_SHA:.github/workflows/apply-causal-authority-clippy-v1.yml"; } | sha256sum | awk '{print $1}')"
            echo "patch_script_sha256=$({ git show "$CONSTRUCTOR_SOURCE_SHA:.github/patches/repair_causal_authority_clippy_v1.py"; } | sha256sum | awk '{print $1}')"
            echo "target_base=$TARGET_BASE_SHA"
            echo "clean_review_head=$CLEAN_REVIEW_HEAD_SHA"
            echo "clean_review_tree=$(git rev-parse "$CLEAN_REVIEW_HEAD_SHA^{tree}")"
            echo "repaired_authority_sha256=$(sha256sum src/authority.rs | awk '{print $1}')"
            echo "repaired_authority_git_blob=$(git hash-object src/authority.rs)"
            echo "cargo_toml_sha256=$(sha256sum Cargo.toml | awk '{print $1}')"
            echo "resolved_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            rustc -vV
            cargo -Vv
          } > "$OUT/provenance.txt"
          cat "$OUT/provenance.txt"

      - name: Retain exact repaired-source capsule
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-authority-clippy-repair-${{ env.CONSTRUCTOR_SOURCE_SHA }}
          path: ${{ runner.temp }}/causal-authority-repair-capsule
          if-no-files-found: error
          retention-days: 90

  materialize:
    name: Materialize clean candidate without executing candidate code
    needs: construct
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CONSTRUCTOR_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Restore qualified repaired-source capsule
        uses: actions/download-artifact@v4
        with:
          name: causal-authority-clippy-repair-${{ env.CONSTRUCTOR_SOURCE_SHA }}
          path: ${{ runner.temp }}/causal-authority-repair-capsule

      - name: Verify capsule and materialize clean one-commit candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONSTRUCTOR_SOURCE_SHA"
          test -z "$(git status --porcelain)"

          OUT="$RUNNER_TEMP/causal-authority-repair-capsule"
          test -s "$OUT/authority.rs"
          test -s "$OUT/Cargo.lock"
          test -s "$OUT/provenance.txt"

          test "$(sed -n 's/^constructor_source=//p' "$OUT/provenance.txt")" = "$CONSTRUCTOR_SOURCE_SHA"
          test "$(sed -n 's/^target_base=//p' "$OUT/provenance.txt")" = "$TARGET_BASE_SHA"
          test "$(sed -n 's/^clean_review_head=//p' "$OUT/provenance.txt")" = "$CLEAN_REVIEW_HEAD_SHA"
          test "$(sha256sum "$OUT/authority.rs" | awk '{print $1}')" = \
            "$(sed -n 's/^repaired_authority_sha256=//p' "$OUT/provenance.txt")"
          test "$(git hash-object "$OUT/authority.rs")" = \
            "$(sed -n 's/^repaired_authority_git_blob=//p' "$OUT/provenance.txt")"
          test "$(sha256sum "$OUT/Cargo.lock" | awk '{print $1}')" = \
            "$(sed -n 's/^resolved_lock_sha256=//p' "$OUT/provenance.txt")"

          git fetch --no-tags origin "$TARGET_BASE_SHA" "$CLEAN_REVIEW_HEAD_SHA"
          test "$(git rev-parse "$CLEAN_REVIEW_HEAD_SHA^")" = "$TARGET_BASE_SHA"
          test "$(git rev-list --count "$TARGET_BASE_SHA..$CLEAN_REVIEW_HEAD_SHA")" = 1

          WORK="$RUNNER_TEMP/causal-authority-clean-candidate"
          rm -rf "$WORK"
          git worktree add --detach "$WORK" "$CLEAN_REVIEW_HEAD_SHA"
          cd "$WORK"

          cp "$OUT/authority.rs" src/authority.rs
          mapfile -t relative_delta < <(git diff --name-only | LC_ALL=C sort)
          test "${#relative_delta[@]}" = 1
          test "${relative_delta[0]}" = "src/authority.rs"
          git diff --check

          grep -q 'reason.len() > MAX_AUTHORITY_RESPONSE_REASON_BYTES' src/authority.rs
          grep -q 'self.core.reason.len() > MAX_AUTHORITY_RESPONSE_REASON_BYTES' src/authority.rs
          grep -q 'request.core.reason.len() > MAX_AUTHORITY_REQUEST_REASON_BYTES' src/authority.rs
          ! grep -q 'reason.as_bytes().len() > MAX_AUTHORITY_RESPONSE_REASON_BYTES' src/authority.rs
          ! grep -q 'self.core.reason.as_bytes().len() > MAX_AUTHORITY_RESPONSE_REASON_BYTES' src/authority.rs
          ! grep -q 'request.core.reason.as_bytes().len() > MAX_AUTHORITY_REQUEST_REASON_BYTES' src/authority.rs

          # Candidate tree must differ from the prior clean review tree only in
          # the repaired source file, while retaining exactly the prior review
          # surface relative to #30.
          mapfile -t EXPECTED_REVIEW_FILES < <(git diff --name-only "$TARGET_BASE_SHA..$CLEAN_REVIEW_HEAD_SHA" | LC_ALL=C sort)

          git add src/authority.rs
          mapfile -t staged < <(git diff --cached --name-only | LC_ALL=C sort)
          test "${#staged[@]}" = 1
          test "${staged[0]}" = "src/authority.rs"
          git diff --cached --check

          AUTHOR_NAME="$(git show -s --format=%an "$CLEAN_REVIEW_HEAD_SHA")"
          AUTHOR_EMAIL="$(git show -s --format=%ae "$CLEAN_REVIEW_HEAD_SHA")"
          AUTHOR_DATE="$(git show -s --format=%aI "$CLEAN_REVIEW_HEAD_SHA")"
          COMMITTER_NAME="$(git show -s --format=%cn "$CLEAN_REVIEW_HEAD_SHA")"
          COMMITTER_EMAIL="$(git show -s --format=%ce "$CLEAN_REVIEW_HEAD_SHA")"
          COMMITTER_DATE="$(git show -s --format=%cI "$CLEAN_REVIEW_HEAD_SHA")"

          GIT_AUTHOR_NAME="$AUTHOR_NAME" \
          GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL" \
          GIT_AUTHOR_DATE="$AUTHOR_DATE" \
          GIT_COMMITTER_NAME="$COMMITTER_NAME" \
          GIT_COMMITTER_EMAIL="$COMMITTER_EMAIL" \
          GIT_COMMITTER_DATE="$COMMITTER_DATE" \
            git commit --amend -C "$CLEAN_REVIEW_HEAD_SHA"

          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$TARGET_BASE_SHA"
          test "$(git rev-list --count "$TARGET_BASE_SHA..$CANDIDATE_SHA")" = 1

          mapfile -t ACTUAL_REVIEW_FILES < <(git diff --name-only "$TARGET_BASE_SHA..$CANDIDATE_SHA" | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' "${EXPECTED_REVIEW_FILES[@]}") \
            <(printf '%s\n' "${ACTUAL_REVIEW_FILES[@]}")

          mapfile -t FINAL_RELATIVE_DELTA < <(git diff --name-only "$CLEAN_REVIEW_HEAD_SHA..$CANDIDATE_SHA" | LC_ALL=C sort)
          test "${#FINAL_RELATIVE_DELTA[@]}" = 1
          test "${FINAL_RELATIVE_DELTA[0]}" = "src/authority.rs"

          test ! -e .github/patches/repair_causal_authority_clippy_v1.py
          test ! -e .github/workflows/apply-causal-authority-clippy-v1.yml
          test -z "$(git status --porcelain)"

          REMOTE_SHA="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          if [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "ERROR: clean candidate ref already exists at different SHA: $REMOTE_SHA" >&2
            exit 1
          fi
          if [[ -z "$REMOTE_SHA" ]]; then
            git push origin "$CANDIDATE_SHA:refs/heads/$CANDIDATE_BRANCH"
          fi
          PUBLISHED_SHA="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          test "$PUBLISHED_SHA" = "$CANDIDATE_SHA"

          git update-ref refs/heads/clean-candidate "$CANDIDATE_SHA"
          git bundle create "$OUT/clean-candidate.bundle" \
            refs/heads/clean-candidate "^$TARGET_BASE_SHA"
          git bundle verify "$OUT/clean-candidate.bundle"

          {
            echo 'profile=xenia-wire-causal-authority-clean-materialization-v2'
            echo "constructor_source=$CONSTRUCTOR_SOURCE_SHA"
            echo "target_base=$TARGET_BASE_SHA"
            echo "clean_review_head=$CLEAN_REVIEW_HEAD_SHA"
            echo "candidate_branch=$CANDIDATE_BRANCH"
            echo "candidate_head=$CANDIDATE_SHA"
            echo "candidate_tree=$CANDIDATE_TREE"
            echo "published_head=$PUBLISHED_SHA"
            echo 'review_files:'
            printf '  %s\n' "${ACTUAL_REVIEW_FILES[@]}"
          } > "$OUT/materialization-receipt.txt"
          cat "$OUT/materialization-receipt.txt"

      - name: Retain clean-candidate materialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-authority-clean-materialization-${{ env.CONSTRUCTOR_SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/causal-authority-repair-capsule/clean-candidate.bundle
            ${{ runner.temp }}/causal-authority-repair-capsule/materialization-receipt.txt
          if-no-files-found: error
          retention-days: 90
