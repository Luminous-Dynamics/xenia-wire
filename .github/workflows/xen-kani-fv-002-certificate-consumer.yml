                  statuses=get(f"/commits/{head_sha}/statuses",context=STATUS_CONTEXT,per_page=100)
                  matching=[item for item in statuses if isinstance(item,dict) and item.get("context","").lower()==STATUS_CONTEXT.lower()]
                  matching.sort(key=lambda item: int(item.get("id",0)),reverse=True)
                  if not matching or matching[0].get("state")!="success":
                      continue
                  status=matching[0]
                  target=status.get("target_url")
                  match=re.fullmatch(r"https://github.com/Luminous-Dynamics/xenia-wire/actions/runs/([1-9][0-9]*)/attempts/([1-9][0-9]*)",str(target))
                  assert match, f"unexpected certificate status target URL for PR #{number}"
                  consumer_run_id=int(match.group(1))
                  consumer_run_attempt=int(match.group(2))
                  consumer_run=get(f"/actions/runs/{consumer_run_id}/attempts/{consumer_run_attempt}")
                  assert consumer_run["run_attempt"]==consumer_run_attempt
                  assert consumer_run["name"]=="XEN-KANI-FV-002 Certificate Consumer"
                  assert consumer_run["path"]==CONSUMER_PATH
                  assert consumer_run["event"]=="workflow_run"
