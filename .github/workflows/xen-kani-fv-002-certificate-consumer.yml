name: XEN-KANI-FV-002 Certificate Consumer

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: xen-kani-fv-002-certificate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  REPOSITORY: Luminous-Dynamics/xenia-wire
  REPOSITORY_ID: "1213976974"
  VERIFIER_WORKFLOW_ID: "373418900"
  VERIFIER_WORKFLOW_PATH: .github/workflows/xen-kani-fv-002-trusted-admission.yml
  VERIFIER_WORKFLOW_NAME: Trusted XEN-KANI-FV-002 Admission
  EXPECTED_TRIGGER_WORKFLOW_ID: "373424313"
  EXPECTED_TRIGGER_WORKFLOW_NAME: XEN-KANI-FV-002 Replay Kernel
  EXPECTED_TRIGGER_WORKFLOW_PATH: .github/workflows/xen-kani-fv-002-replay-kernel-v2.yml
  EXPECTED_TRIGGER_BRANCH: formal/xen-kani-fv-002-replay-kernel
  EXPECTED_QUALIFIED_HEAD_SHA: 1fbea431db9e7e20ae3b31e925219a90de2b36bd
  EXPECTED_BASE_SHA_ANCHOR: 057dd03043b8863d8f8280abf333331cc9ddf317
  EXPECTED_KERNEL_BLOB: d1bc8a1f8fc0883856d5073fa37b1658a7ea63ad
  EXPECTED_PROOF_BLOB: 4e3f0f584ca189baafe230da66b4bdeac87a7515
  EXPECTED_EVIDENCE_CONTRACT_BLOB: ce3e1447cc6b9bd1f0fc361b4fb81c5fe1450b0b
  EXPECTED_VERIFIER_WORKFLOW_BLOB: ebcf21039c20bc61061f8dc500817554a434970a
  CONSUMER_WORKFLOW_PATH: .github/workflows/xen-kani-fv-002-certificate-consumer.yml
  PROMOTION_TERMINAL_PREFIX: trusted-xen-kani-fv-002-promotion-terminal-
  PROMOTION_TERMINAL_SCHEMA: xenia.formal.kani-replay-kernel.promotion-terminal.v1
  PROMOTION_CERTIFICATE_CANONICALIZATION: xenia.canonical-json.utf8.sort-keys.no-floats.v1
  CANONICALIZATION_VECTORS_PATH: docs/formal/xen-kani-fv-002-canonical-json-v1-vectors.json
  EXPECTED_CANONICALIZATION_VECTORS_BLOB: 2094645ec64821f8c8bbed58d2b340a5d90f20f5
  MAX_PROMOTION_TERMINAL_BYTES: "5242880"
  MAX_CERTIFICATE_MEMBER_BYTES: "1048576"
  MAX_CERTIFICATE_TOTAL_UNCOMPRESSED_BYTES: "4194304"

jobs:
  certificate-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Consume trusted qualification certificate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "pull_request_target"
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW" = "XEN-KANI-FV-002 Certificate Consumer"
          test "$GITHUB_WORKFLOW_REF" = "$REPOSITORY/$CONSUMER_WORKFLOW_PATH@refs/heads/main"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test -n "$PR_NUMBER"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]

          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          REPO=os.environ["REPOSITORY"]
          REPO_ID=int(os.environ["REPOSITORY_ID"])
          VERIFIER_WORKFLOW_ID=int(os.environ["VERIFIER_WORKFLOW_ID"])
          VERIFIER_WORKFLOW_PATH=os.environ["VERIFIER_WORKFLOW_PATH"]
          VERIFIER_WORKFLOW_NAME=os.environ["VERIFIER_WORKFLOW_NAME"]
          PR_NUMBER=int(os.environ["PR_NUMBER"])
          PREFIX=os.environ["PROMOTION_TERMINAL_PREFIX"]
          MAX_BYTES=int(os.environ["MAX_PROMOTION_TERMINAL_BYTES"])
          TOKEN=os.environ["GITHUB_TOKEN"]
          API_BASE=f"https://api.github.com/repos/{REPO}"

          def get(path, **query):
              url=API_BASE+path
              if query:
                  url += "?" + urllib.parse.urlencode(query)
              request=urllib.request.Request(
                  url,
                  headers={
                      "Authorization":"Bearer "+TOKEN,
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2026-03-10",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read())

          class SafeRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if redirected is None:
                      return None
                  old_host=urllib.parse.urlsplit(req.full_url).netloc
                  new_host=urllib.parse.urlsplit(newurl).netloc
                  if old_host != new_host:
                      redirected.headers.pop("Authorization",None)
                      redirected.headers.pop("authorization",None)
                  return redirected

          HTTP_OPENER=urllib.request.build_opener(SafeRedirectHandler)

          def download(url, max_bytes):
              request=urllib.request.Request(
                  url,
                  headers={
                      "Authorization":"Bearer "+TOKEN,
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2026-03-10",
                  },
              )
              with HTTP_OPENER.open(request, timeout=60) as response:
                  data=response.read(max_bytes+1)
              assert len(data)<=max_bytes, f"download exceeded bounded size: {len(data)}"
              return data

          def sha256_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def strict_json(data, label):
              def unique_pairs(pairs):
                  result={}
                  for key,value in pairs:
                      assert key not in result, f"{label}: duplicate JSON key: {key!r}"
                      result[key]=value
                  return result
              try:
                  text_value=data.decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise AssertionError(f"{label}: invalid UTF-8: {exc}") from exc
              return json.loads(text_value, object_pairs_hook=unique_pairs)

          def validate_canonical_value(value, label):
              if isinstance(value,bool) or value is None:
                  return
              if isinstance(value,int):
                  return
              if isinstance(value,float):
                  raise AssertionError(f"{label}: floating-point JSON values are forbidden by the certificate identity algorithm")
              if isinstance(value,str):
                  assert all(not (0xD800 <= ord(ch) <= 0xDFFF) for ch in value), (
                      f"{label}: surrogate code points are forbidden"
                  )
                  return
              if isinstance(value,list):
                  for index,item in enumerate(value):
                      validate_canonical_value(item,f"{label}[{index}]")
                  return
              if isinstance(value,dict):
                  for key,item in value.items():
                      assert isinstance(key,str), f"{label}: object key is not a string"
                      assert all(not (0xD800 <= ord(ch) <= 0xDFFF) for ch in key), (
                          f"{label}: surrogate code point in object key"
                      )
                      validate_canonical_value(item,f"{label}.{key}")
                  return
              raise AssertionError(f"{label}: unsupported JSON value type: {type(value).__name__}")

          def canonical_certificate_bytes(value):
              validate_canonical_value(value,"promotion-terminal")
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",",":"),
                  allow_nan=False,
              ).encode("utf-8")


          def parse_time(value):
              return datetime.fromisoformat(value.replace("Z","+00:00")).astimezone(timezone.utc)

          def assert_certificate_canonicalization_selftest():
              sample=canonical_certificate_bytes({
                  "z":["é",None],
                  "b":1,
                  "a":True,
              })
              assert sample==b'{"a":true,"b":1,"z":["é",null]}'
              duplicate_rejected=False
              try:
                  strict_json(b'{"a":1,"a":2}',"duplicate-vector")
              except AssertionError:
                  duplicate_rejected=True
              assert duplicate_rejected
              float_rejected=False
              try:
                  canonical_certificate_bytes({"x":1.0})
              except AssertionError:
                  float_rejected=True
              assert float_rejected
              surrogate_rejected=False
              try:
                  canonical_certificate_bytes({"x":"\ud800"})
              except AssertionError:
                  surrogate_rejected=True
              assert surrogate_rejected

          assert_certificate_canonicalization_selftest()

          def verify_canonicalization_vectors(document):
              assert document["schema"]=="xenia.formal.kani-replay-kernel.canonical-json-v1-vectors"
              assert document["algorithm"]==os.environ["PROMOTION_CERTIFICATE_CANONICALIZATION"]
              assert document["key_order"]=="Unicode scalar value lexicographic order over decoded JSON object member names"
              vectors=document.get("vectors")
              assert isinstance(vectors,list)
              expected_ids={
                  "ascii-object-key-order",
                  "nested-unicode-and-escapes",
                  "large-integer-preserved",
                  "unicode-code-point-key-order",
                  "unicode-scalar-key-order",
                  "whitespace-and-negative-zero",
                  "duplicate-keys-rejected",
                  "invalid-utf8-rejected",
                  "float-rejected",
                  "surrogate-rejected",
                  "nonfinite-rejected",
              }
              observed_ids=[v.get("id") for v in vectors if isinstance(v,dict)]
              assert len(vectors)==len(expected_ids)
              assert len(observed_ids)==len(set(observed_ids))
              assert set(observed_ids)==expected_ids
              for vector in vectors:
                  assert isinstance(vector,dict)
                  vector_id=vector["id"]
                  kind=vector["kind"]
                  raw=bytes.fromhex(vector["raw_utf8_hex"]) if "raw_utf8_hex" in vector else None
                  if kind=="accept_value":
                      assert isinstance(vector.get("canonical_utf8_hex"),str)
                      assert canonical_certificate_bytes(vector["value"]).hex()==vector["canonical_utf8_hex"], vector_id
                  elif kind=="accept_raw_json":
                      assert raw is not None
                      parsed=strict_json(raw,vector_id)
                      assert canonical_certificate_bytes(parsed).hex()==vector["canonical_utf8_hex"], vector_id
                  elif kind=="reject_raw_json":
                      assert raw is not None
                      expected_failure=vector.get("expected_failure")
                      expected_fragments={
                          "duplicate_json_key":["duplicate JSON key"],
                          "invalid_utf8":["invalid UTF-8"],
                          "floating_point":["floating-point JSON values"],
                          "surrogate":["surrogate code point"],
                          "nonfinite_or_float":["floating-point JSON values"],
                      }
                      assert expected_failure in expected_fragments, vector_id
                      try:
                          parsed=strict_json(raw,vector_id)
                          canonical_certificate_bytes(parsed)
                      except AssertionError as exc:
                          message=str(exc)
                          assert any(
                              fragment in message
                              for fragment in expected_fragments[expected_failure]
                          ), (
                              f"canonicalization rejection vector failed with unexpected "
                              f"reason: {vector_id}: {message!r}"
                          )
                          continue
                      raise AssertionError(f"canonicalization rejection vector unexpectedly accepted: {vector_id}")
                  else:
                      raise AssertionError(f"unsupported canonicalization vector kind: {kind}")

          canonicalization_vectors=get(
              f"/contents/{urllib.parse.quote(os.environ["CANONICALIZATION_VECTORS_PATH"],safe="/")}",
              ref=os.environ["GITHUB_WORKFLOW_SHA"],
          )
          assert canonicalization_vectors["type"]=="file"
          assert canonicalization_vectors["path"]==os.environ["CANONICALIZATION_VECTORS_PATH"]
          assert canonicalization_vectors["sha"]==os.environ["EXPECTED_CANONICALIZATION_VECTORS_BLOB"]
          canonicalization_vector_bytes=base64.b64decode(canonicalization_vectors["content"])
          canonicalization_vector_document=strict_json(canonicalization_vector_bytes,"canonicalization-vectors")
          verify_canonicalization_vectors(canonicalization_vector_document)

          def verify_repo(obj, key):
              repo=obj.get(key,{})
              assert repo.get("id")==REPO_ID, f"{key}.id mismatch"
              assert repo.get("full_name")==REPO, f"{key}.full_name mismatch"

          consumer_workflow=get(
              f"/contents/{urllib.parse.quote(os.environ["CONSUMER_WORKFLOW_PATH"],safe="/")}",
              ref=os.environ["GITHUB_WORKFLOW_SHA"],
          )
          assert consumer_workflow["type"]=="file"
          assert consumer_workflow["path"]==os.environ["CONSUMER_WORKFLOW_PATH"]
          assert re.fullmatch(r"[0-9a-f]{40}",consumer_workflow["sha"])

          pr=get(f"/pulls/{PR_NUMBER}")
          assert pr["number"]==PR_NUMBER
          assert pr["state"]=="open"
          assert pr["merged"] is False
          assert pr["base"]["ref"]=="main"
          verify_repo(pr,"base")
          verify_repo(pr,"head")
          head_sha=pr["head"]["sha"]
          base_sha=pr["base"]["sha"]
          assert re.fullmatch(r"[0-9a-f]{40}",head_sha)
          assert re.fullmatch(r"[0-9a-f]{40}",base_sha)

          qualification_paths={
              "src/replay_kernel.rs",
              "src/replay_kernel_kani.rs",
              "src/replay_window.rs",
              "fuzz/fuzz_targets/fuzz_replay_window.rs",
              "src/lib.rs",
              "Cargo.toml",
              "docs/formal/xen-kani-fv-002-replay-kernel-v1.json",
              ".github/workflows/xen-kani-fv-002-replay-kernel-v2.yml",
          }
          changed_files=[]
          first_files=get(f"/pulls/{PR_NUMBER}/files",per_page=100,page=1)
          total_file_count=0
          page=1
          while True:
              files=first_files if page==1 else get(f"/pulls/{PR_NUMBER}/files",per_page=100,page=page)
              batch=files if isinstance(files,list) else []
              if not batch:
                  break
              assert len(batch)<=100
              changed_files.extend(batch)
              total_file_count += len(batch)
              if len(batch)<100:
                  break
              page += 1
              assert page<=30, "pull request changed-file surface reached the API's 3000-file cap"
          assert len(changed_files)==total_file_count
          assert len(changed_files)<3000, "changed-file API cap prevents complete scope determination"
          applicable_files=sorted({
              candidate
              for file in changed_files
              for candidate in (file.get("filename"),file.get("previous_filename"))
              if candidate in qualification_paths
          })
          if not applicable_files:
              decision={
                  "schema":"xenia.formal.kani-replay-kernel.certificate-consumer.v1",
                  "decision":"NOT_APPLICABLE",
                  "scope":"OUT_OF_SCOPE",
                  "pr_number":PR_NUMBER,
                  "head_sha":head_sha,
                  "main_sha":None,
                  "changed_file_count":len(changed_files),
                  "qualification_files_observed":[],
              }
              Path("/tmp/xen-kani-fv-002-consumer-decision.json").write_text(
                  json.dumps(decision,indent=2,sort_keys=True)+"\n"
              )
              Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
                  "## XEN-KANI-FV-002 Certificate Consumer\n\n"
                  "Decision: NOT_APPLICABLE\n\n"
                  f"PR #{PR_NUMBER}\n"
                  f"Subject head: {head_sha}\n"
                  f"Changed files inspected: {len(changed_files)}\n"
                  "No XEN-KANI-FV-002 qualification subject or qualification workflow path changed.\n"
              )
              print(json.dumps(decision,indent=2,sort_keys=True))
              raise SystemExit(0)

          main=get("/branches/main")
          assert main["name"]=="main"
          assert main["protected"] is True
          current_main_sha=main["commit"]["sha"]
          assert re.fullmatch(r"[0-9a-f]{40}",current_main_sha)
          assert base_sha==current_main_sha, (
              f"stale PR base: base={base_sha} current_main={current_main_sha}"
          )

          main_commit=get(f"/commits/{current_main_sha}")
          assert main_commit["sha"]==current_main_sha
          verify_repo(main_commit,"repository")
          verification=main_commit["commit"]["verification"]
          assert verification["verified"] is True
          assert verification["reason"]=="valid"
          assert verification.get("signature")
          assert verification.get("payload")
          assert verification.get("verified_at")

          verifier_source=get(
              f"/contents/{urllib.parse.quote(VERIFIER_WORKFLOW_PATH,safe='/')}",
              ref=current_main_sha,
          )
          assert verifier_source["type"]=="file"
          assert verifier_source["name"]=="xen-kani-fv-002-trusted-admission.yml"
          assert verifier_source["path"]==VERIFIER_WORKFLOW_PATH
          assert verifier_source["sha"]==os.environ["EXPECTED_VERIFIER_WORKFLOW_BLOB"]

          verifier_runs=get(
              f"/actions/workflows/{VERIFIER_WORKFLOW_ID}/runs",
              head_sha=current_main_sha,
              event="workflow_run",
              status="completed",
              per_page=100,
              page=1,
          )
          verifier_candidates=[
              run for run in verifier_runs.get("workflow_runs",[])
              if isinstance(run,dict)
              and run.get("id")
              and run.get("name")==VERIFIER_WORKFLOW_NAME
              and run.get("path")==VERIFIER_WORKFLOW_PATH
              and run.get("workflow_id")==VERIFIER_WORKFLOW_ID
              and run.get("event")=="workflow_run"
              and run.get("status")=="completed"
              and run.get("conclusion")=="success"
              and run.get("head_branch")=="main"
              and run.get("head_sha")==current_main_sha
              and run.get("repository",{}).get("id")==REPO_ID
              and run.get("repository",{}).get("full_name")==REPO
          ]
          assert verifier_candidates, (
              f"no successful trusted verifier run for current main tip {current_main_sha}"
          )
          verifier_candidates.sort(
              key=lambda run:(parse_time(run["updated_at"]),int(run["id"])),
              reverse=True,
          )
          producer_run=verifier_candidates[0]
          producer_run_id=int(producer_run["id"])
          producer_run_attempt=int(producer_run["run_attempt"])
          producer_attempt=get(f"/actions/runs/{producer_run_id}/attempts/{producer_run_attempt}")
          assert producer_attempt["id"]==producer_run_id
          assert producer_attempt["run_attempt"]==producer_run_attempt
          assert producer_attempt["workflow_id"]==VERIFIER_WORKFLOW_ID
          assert producer_attempt["path"]==VERIFIER_WORKFLOW_PATH
          assert producer_attempt["event"]=="workflow_run"
          assert producer_attempt["status"]=="completed"
          assert producer_attempt["conclusion"]=="success"
          assert producer_attempt["head_branch"]=="main"
          assert producer_attempt["head_sha"]==current_main_sha
          assert producer_attempt["repository"]["id"]==REPO_ID
          assert producer_attempt["repository"]["full_name"]==REPO

          expected_artifact_name=(
              f"{PREFIX}{PR_NUMBER}-{head_sha}-{producer_run_id}-{producer_run_attempt}"
          )
          producer_artifacts=get(
              f"/actions/runs/{producer_run_id}/artifacts",
              per_page=100,
              page=1,
          )
          assert len(producer_artifacts.get("artifacts",[]))<=100
          producer_candidates=[
              artifact for artifact in producer_artifacts.get("artifacts",[])
              if isinstance(artifact,dict)
              and artifact.get("name")==expected_artifact_name
              and artifact.get("expired") is False
          ]
          assert len(producer_candidates)==1, (
              f"expected exactly one promotion-terminal artifact from producer run, "
              f"observed={len(producer_candidates)}"
          )
          artifact=producer_candidates[0]
          artifact_id=int(artifact["id"])
          artifact_name=artifact["name"]
          artifact_digest=artifact["digest"]
          assert re.fullmatch(r"sha256:[0-9a-f]{64}",artifact_digest)
          assert artifact["expired"] is False
          artifact_run_meta=artifact["workflow_run"]
          assert artifact_run_meta["id"]==producer_run_id
          assert artifact_run_meta["repository_id"]==REPO_ID
          assert artifact_run_meta["head_repository_id"]==REPO_ID
          assert artifact_run_meta["head_sha"]==current_main_sha

          archive_url=f"{API_BASE}/actions/artifacts/{artifact_id}/zip"
          archive=download(archive_url,MAX_BYTES)
          assert sha256_bytes(archive)==artifact_digest.removeprefix("sha256:")

          MAX_MEMBER_BYTES=int(os.environ["MAX_CERTIFICATE_MEMBER_BYTES"])
          MAX_TOTAL_UNCOMPRESSED_BYTES=int(os.environ["MAX_CERTIFICATE_TOTAL_UNCOMPRESSED_BYTES"])

          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              infos=z.infolist()
              names=[info.filename for info in infos]
              assert names
              assert len(names)==len(set(names))
              assert all(
                  name
                  and "\x00" not in name
                  and "\\" not in name
                  and not name.startswith("/")
                  and ".." not in name.split("/")
                  for name in names
              )
              total_uncompressed=0
              for info in infos:
                  assert not (info.flag_bits & 0x1), f"encrypted ZIP member forbidden: {info.filename!r}"
                  assert info.file_size<=MAX_MEMBER_BYTES, (
                      f"ZIP member exceeds bounded expansion: {info.filename!r} "
                      f"size={info.file_size}"
                  )
                  total_uncompressed += info.file_size
                  assert total_uncompressed<=MAX_TOTAL_UNCOMPRESSED_BYTES, (
                      f"ZIP total expansion exceeds bounded size: {total_uncompressed}"
                  )

              def read_member(name):
                  info=z.getinfo(name)
                  with z.open(info) as member:
                      data=member.read(MAX_MEMBER_BYTES+1)
                  assert len(data)<=MAX_MEMBER_BYTES, (
                      f"ZIP member exceeded bounded read: {name!r}: {len(data)}"
                  )
                  return data

              expected_members={
                  "promotion-terminal.json",
                  "terminal-main-branch.json",
                  "terminal-main-commit.json",
                  "trusted-artifact.json",
                  "trusted-artifact-provenance.txt",
                  "trusted-artifact-download.sha256",
                  "trusted-artifact-members.txt",
                  "terminal-pr.json",
              }
              assert set(names)==expected_members, (
                  f"promotion-terminal member mismatch: "
                  f"unexpected={sorted(set(names)-expected_members)} "
                  f"missing={sorted(expected_members-set(names))}"
              )
              terminal=strict_json(read_member("promotion-terminal.json"),"promotion-terminal.json")
              terminal_main_branch=strict_json(read_member("terminal-main-branch.json"),"terminal-main-branch.json")
              terminal_main_commit=strict_json(read_member("terminal-main-commit.json"),"terminal-main-commit.json")
              trusted_artifact=strict_json(read_member("trusted-artifact.json"),"trusted-artifact.json")
              terminal_pr=strict_json(read_member("terminal-pr.json"),"terminal-pr.json")
              provenance=read_member("trusted-artifact-provenance.txt").decode("utf-8")
              evidence_zip_digest=read_member("trusted-artifact-download.sha256").decode("utf-8").strip()
              evidence_members=read_member("trusted-artifact-members.txt").decode("utf-8").splitlines()

          assert terminal["schema"]==os.environ["PROMOTION_TERMINAL_SCHEMA"]
          canonical_terminal=canonical_certificate_bytes(terminal)
          promotion_certificate_payload_digest="sha256:"+sha256_bytes(canonical_terminal)
          assert re.fullmatch(r"sha256:[0-9a-f]{64}",promotion_certificate_payload_digest)
          assert terminal["promotion_eligible"] is True
          assert terminal["verifier_workflow_id"]==VERIFIER_WORKFLOW_ID
          assert terminal["verifier_workflow_path"]==VERIFIER_WORKFLOW_PATH
          assert terminal["verifier_workflow_blob"]==os.environ["EXPECTED_VERIFIER_WORKFLOW_BLOB"]
          assert terminal["verifier_workflow_commit"]==producer_run["head_sha"]
          assert terminal["pr_number"]==PR_NUMBER
          assert terminal["head_sha"]==head_sha
          assert terminal["head_repo"]==REPO
          assert terminal["head_repo_id"]==REPO_ID
          assert terminal["qualified_head_sha_expected"]==os.environ["EXPECTED_QUALIFIED_HEAD_SHA"]
          assert terminal["qualified_head_sha_verified"] is True
          assert head_sha==os.environ["EXPECTED_QUALIFIED_HEAD_SHA"]
          assert terminal["base_sha_anchor"]==os.environ["EXPECTED_BASE_SHA_ANCHOR"]
          assert terminal["kernel_blob"]==os.environ["EXPECTED_KERNEL_BLOB"]
          assert terminal["proof_blob"]==os.environ["EXPECTED_PROOF_BLOB"]
          assert terminal["evidence_contract_blob"]==os.environ["EXPECTED_EVIDENCE_CONTRACT_BLOB"]
          assert terminal["pr_base_ref"]=="main"
          assert terminal["triggering_workflow"]==os.environ["EXPECTED_TRIGGER_WORKFLOW_NAME"]
