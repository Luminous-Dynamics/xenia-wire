                  audit_matches=[
                      item for item in audit_statuses
                      if isinstance(item,dict)
                      and item.get("context","").lower()==os.environ["INDEPENDENT_AUDIT_STATUS_CONTEXT"].lower()
                  ]
                  audit_matches.sort(key=lambda item: int(item.get("id",0)),reverse=True)

                  if decision["decision"]=="QUALIFIED_FOR_MERGE":
                      assert audit_matches and audit_matches[0].get("state")=="success"
                      audit_status=audit_matches[0]
                      audit_target=audit_status.get("target_url")
                      audit_match=re.fullmatch(
                          r"https://github.com/Luminous-Dynamics/xenia-wire/actions/runs/([1-9][0-9]*)/attempts/([1-9][0-9]*)",
