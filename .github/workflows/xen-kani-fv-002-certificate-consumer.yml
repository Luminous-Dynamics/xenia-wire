                  with zipfile.ZipFile(io.BytesIO(archive)) as z:
                      assert z.namelist()==["xen-kani-fv-002-consumer-decision.json"]
                      decision=strict_json(z.read("xen-kani-fv-002-consumer-decision.json"),"consumer-decision")
                  assert decision["schema"]=="xenia.formal.kani-replay-kernel.certificate-consumer.v1"
                  assert decision["pr_number"]==number
                  assert decision["head_sha"]==head_sha
                  assert decision["main_sha"]==current_main_sha
                  assert decision["consumer_workflow_sha"]==consumer_run["head_sha"]
                  assert decision["consumer_workflow_blob"]==get(f"/contents/{urllib.parse.quote(CONSUMER_PATH,safe='/')}",ref=current_main_sha)["sha"]
                  assert decision["decision"] in {"QUALIFIED_FOR_MERGE","NOT_APPLICABLE"}
                  assert decision["main_protected"] is True
                  assert decision["main_tip_signature_verified"] is True
                  assert base_sha==current_main_sha

                  audit_statuses=get(
