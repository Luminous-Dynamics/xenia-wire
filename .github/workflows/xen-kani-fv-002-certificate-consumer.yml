              "promotion_certificate_canonicalization_selftest_verified":True,
              "promotion_certificate_canonicalization_vectors_verified":True,
              "promotion_certificate_canonicalization_vectors_blob":os.environ["EXPECTED_CANONICALIZATION_VECTORS_BLOB"],
              "verifier_run_candidates_observed":len(verifier_candidates),
              "promotion_terminal_candidates":len(producer_candidates),
              "certificate_verifier_workflow_id":VERIFIER_WORKFLOW_ID,
              "certificate_verifier_workflow_blob":os.environ["EXPECTED_VERIFIER_WORKFLOW_BLOB"],
              "certificate_subject_qualified_head_sha":os.environ["EXPECTED_QUALIFIED_HEAD_SHA"],
              "certificate_subject_base_sha_anchor":os.environ["EXPECTED_BASE_SHA_ANCHOR"],
              "certificate_subject_kernel_blob":os.environ["EXPECTED_KERNEL_BLOB"],
              "certificate_subject_proof_blob":os.environ["EXPECTED_PROOF_BLOB"],
              "certificate_subject_evidence_contract_blob":os.environ["EXPECTED_EVIDENCE_CONTRACT_BLOB"],
              "certificate_trigger_workflow_id":int(os.environ["EXPECTED_TRIGGER_WORKFLOW_ID"]),
              "certificate_trigger_workflow_path":os.environ["EXPECTED_TRIGGER_WORKFLOW_PATH"],
              "certificate_trigger_branch":os.environ["EXPECTED_TRIGGER_BRANCH"],
              "certificate_verifier_workflow_commit":producer_run["head_sha"],
              "consumer_workflow_ref":os.environ["GITHUB_WORKFLOW_REF"],
              "consumer_workflow_sha":os.environ["GITHUB_WORKFLOW_SHA"],
              "consumer_workflow_blob":consumer_workflow["sha"],
              "scope":"IN_SCOPE",
