name: Causal Authority Conformance

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "src/authority.rs"
      - "src/authority_negotiation.rs"
      - "src/authority_session.rs"
      - "src/consent.rs"
      - "src/lib.rs"
      - "src/negotiated_context.rs"
      - "src/negotiated_context_codec.rs"
      - "src/negotiation_policy.rs"
      - "src/payload_types.rs"
      - "src/session.rs"
      - "src/wire.rs"
      - "tests/causal_authority_adversarial.rs"
      - "tests/causal_authority_session.rs"
      - "tests/causal_authority_vectors.rs"
      - "test-vectors/13_causal_authority_v1.json"
      - "test-vectors/14_negotiated_context_v1.json"
      - "test-vectors/15_capability_negotiation_v1.json"
      - "test-vectors/16_handshake_v2_contract.json"
      - "test-vectors/conformance/verify-causal-authority.mjs"
      - "test-vectors/conformance/verify-negotiated-context.mjs"
      - "test-vectors/conformance/verify-capability-negotiation.mjs"
      - "test-vectors/conformance/verify-handshake-v2-contract.mjs"
      - ".github/workflows/causal-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: causal-authority-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    name: Rust causal-authority only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Check exact feature boundary
        run: cargo check --no-default-features --features causal-authority --all-targets
      - name: Clippy exact feature boundary
        run: cargo clippy --no-default-features --features causal-authority --all-targets -- -D warnings
      - name: Test exact feature boundary
        run: cargo test --no-default-features --features causal-authority
      - name: Reproduce deterministic Rust vector
        run: cargo test --no-default-features --features causal-authority --test causal_authority_vectors -- --nocapture

  negotiation:
    name: Rust authority + handshake negotiation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check strict negotiation feature boundary
        run: cargo check --no-default-features --features causal-authority,handshake --all-targets
      - name: Clippy strict negotiation feature boundary
        run: cargo clippy --no-default-features --features causal-authority,handshake --all-targets -- -D warnings
      - name: Test negotiation, policy, hostile-byte codec, and authority profile
        run: cargo test --no-default-features --features causal-authority,handshake --lib

  node:
    name: Independent Node vector reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reproduce canonical authority bytes, signatures, digests, and authority id
        run: node test-vectors/conformance/verify-causal-authority.mjs
      - name: Reproduce selected-context canonical bytes and SHA-256
        run: node test-vectors/conformance/verify-negotiated-context.mjs
      - name: Reproduce capability offers, deterministic selection, and binding
        run: node test-vectors/conformance/verify-capability-negotiation.mjs
      - name: Verify V2 envelope budget and V5 context vector
        run: node test-vectors/conformance/verify-handshake-v2-contract.mjs
