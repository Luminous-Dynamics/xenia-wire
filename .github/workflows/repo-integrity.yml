name: Repository Integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The adversarial test imports the checker module. Do not let validation
  # create scripts/__pycache__ and then fail its own clean-checkout proof.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  contract:
    name: RC-1 contract / Python stdlib
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record interpreter
        run: python3 --version

      - name: Adversarially test the integrity checker
        run: python3 scripts/test-repo-integrity.py

      - name: Validate repository and claims contracts
        run: python3 scripts/check-repo-integrity.py --check

      - name: Prove validation is observational and checkout is clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
