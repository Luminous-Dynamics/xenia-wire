name: CI Repair Rustfmt

on:
  push:
    branches:
      - causal-authority-ci-repair-v1

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-authority-ci-repair-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt
      - name: Format exact branch
        run: cargo fmt --all
      - name: Commit formatter output if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "rustfmt already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply pinned rustfmt"
          git push origin HEAD:causal-authority-ci-repair-v1
