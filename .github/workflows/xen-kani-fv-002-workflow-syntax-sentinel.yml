name: XEN-KANI-FV-002 Workflow Syntax Sentinel

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Workflow syntax and embedded-source check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-10-08
        with:
          persist-credentials: false
      - name: Parse every workflow and embedded Python
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -rjson - <<'RB'
          require "pathname"

          Pathname(".github/workflows").glob("*.y*ml").sort.each do |path|
            document = Psych.parse_file(path.to_s)
            abort "#{path}: workflow root is not a mapping" unless document.root.is_a?(Psych::Nodes::Mapping)
            seen = {}
            walk = nil
            walk = lambda do |node, location|
              if node.is_a?(Psych::Nodes::Mapping)
                children = node.children || []
                abort "#{path}: odd mapping child count at #{location}" if children.length.odd?
                children.each_slice(2).with_index do |(key, value), index|
                  if key.is_a?(Psych::Nodes::Scalar)
                    name = key.value.to_s
                    abort "#{path}: duplicate YAML key #{name.inspect} at #{location}" if seen[[location, name]]
                    seen[[location, name]] = true
                  end
                  walk.call(key, "#{location}.key#{index}")
                  walk.call(value, "#{location}.value#{index}") if value
                end
              elsif node.respond_to?(:children) && node.children
                node.children.each_with_index { |child, index| walk.call(child, "#{location}[#{index}]") }
              end
            end
            walk.call(document.root, "root")
            puts "YAML OK #{path}"
          end
          RB

          python3 - <<'PY'
          import ast
          import textwrap
          from pathlib import Path

          for path in sorted(Path(".github/workflows").glob("*.y*ml")):
              lines = path.read_text(encoding="utf-8").splitlines()
              index = 0
              count = 0
              while index < len(lines):
                  if "python3 - <<'PY'" not in lines[index]:
                      index += 1
                      continue
                  start = index + 1
                  end = None
                  for candidate in range(start, len(lines)):
                      if lines[candidate].strip() == "PY":
                          end = candidate
                          break
                  if end is None:
                      raise SystemExit(f"{path}: embedded Python heredoc missing closing PY")
                  source = textwrap.dedent("\n".join(lines[start:end]) + "\n")
                  ast.parse(source, filename=str(path))
                  count += 1
                  index = end + 1
              print(f"embedded Python OK {path} blocks={count}")
          PY
