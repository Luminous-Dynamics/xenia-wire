          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github.raw+json"             "https://api.github.com/repos/$EXPECTED_HEAD_REPO/contents/src/replay_kernel.rs?ref=$EXPECTED_QUALIFIED_HEAD_SHA"             -o /tmp/selftest-replay_kernel.rs
          blob="$(git hash-object /tmp/selftest-replay_kernel.rs)"
          echo "$blob" > /tmp/selftest-replay-kernel.blob
          test "$blob" = "$EXPECTED_KERNEL_BLOB"

      - name: Build minimal self-test crate
        shell: bash
