          selftest_observed=selftest.fetch("steps").map { |step| step["name"] }
          trusted_observed=trusted.fetch("steps").map { |step| step["name"] }
          abort "self-test step inventory mismatch" unless selftest_observed == expected_selftest_steps
          abort "trusted step inventory mismatch" unless trusted_observed == expected_trusted_steps
          abort "self-test step count mismatch" unless selftest_observed.length == 9
          abort "trusted step count mismatch" unless trusted_observed.length == 32

          expected_uses=[
