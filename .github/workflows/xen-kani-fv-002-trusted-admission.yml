              and all(
                  isinstance(x,dict)
                  and x.get("structured_status")=="SUCCESS"
                  and int(x.get("property_failed") or 0)==0
                  and int(x.get("property_unreachable") or 0)==0
                  and int(x.get("property_undetermined") or 0)==0
                  and int(x.get("property_solver_error") or 0)==0
                  for x in clean_manifest.get("results",[])
              )
          )
          hostile_ok=False
          if Path("/tmp/hostile.json").exists():
              hostile=json.loads(Path("/tmp/hostile.json").read_text())
              hresults=hostile.get("verification_results",{}).get("results",[])
              candidates=[
                  x for x in hresults
                  if isinstance(x,dict)
                  and (
                      x.get("harness_id")=="kernel_stale_boundary_is_rejected"
                      or str(x.get("harness_id","")).endswith("::kernel_stale_boundary_is_rejected")
                  )
              ]
              failed_checks=[
                  x for x in candidates[0].get("checks",[])
                  if isinstance(x,dict) and str(x.get("status","")).upper()=="FAILURE"
              ] if len(candidates)==1 else []
              hostile_ok=(
                  int(read_optional("/tmp/hostile.exit","125"))!=0
                  and len(candidates)==1
                  and str(candidates[0].get("status","")).upper()=="FAILURE"
                  and bool(failed_checks)
                  and read_optional("/tmp/hostile-mutant-kernel.blob")!=read_optional("/tmp/xen-kani-trusted/kernel.blob")
                  and read_optional("/tmp/hostile-restored-kernel.blob")==read_optional("/tmp/xen-kani-trusted/kernel.blob")
              )

          hostile_cover_ok=False
          if Path("/tmp/cover-hostile.json").exists():
              cover_hostile=json.loads(Path("/tmp/cover-hostile.json").read_text())
              cresults=cover_hostile.get("verification_results",{}).get("results",[])
              candidates=[
                  x for x in cresults
                  if isinstance(x,dict)
                  and (
                      x.get("harness_id")=="cover_initialization_reachable"
                      or str(x.get("harness_id","")).endswith("::cover_initialization_reachable")
                  )
              ]
              cover_checks=[]
              if len(candidates)==1:
                  cover_checks=[
                      x for x in candidates[0].get("checks",[])
                      if isinstance(x,dict)
                      and (
                          ".cover." in str(x.get("name",""))
                          or str(x.get("description","")).startswith("cover condition:")
                      )
                  ]
              hostile_cover_ok=(
                  int(read_optional("/tmp/cover-hostile.exit","0"))==0
                  and len(candidates)==1
                  and str(candidates[0].get("status","")).upper()=="SUCCESS"
                  and len(cover_checks)==1
                  and str(cover_checks[0].get("status","")).upper() in {"UNSATISFIABLE","UNREACHABLE"}
                  and read_optional("/tmp/hostile-cover-mutant-kernel.blob")!=read_optional("/tmp/xen-kani-trusted/kernel.blob")
                  and read_optional("/tmp/hostile-cover-restored-kernel.blob")==read_optional("/tmp/xen-kani-trusted/kernel.blob")
              )

          workflow_identity_ok=(
              read_optional("/tmp/verifier-workflow.blob") is not None
              and read_optional("/tmp/trigger-workflow.blob")==os.environ["EXPECTED_TRIGGER_WORKFLOW_BLOB"]
          )
          tree_delta_ok=Path("/tmp/trusted-tree-delta.txt").exists()

          authority_eligible=(
              read_optional("/tmp/final-pr-freshness.txt") is not None
              and workflow_identity_ok
              and tree_delta_ok
              and kernel_binding
              and proof_binding
              and evidence_binding
              and reachability_ok
              and clean_proofs_ok
              and hostile_ok
              and hostile_cover_ok
              and ("CBMC "+os.environ["EXPECTED_KANI_CBMC_VERSION"]) in read_optional("/tmp/kani-version.txt","")
              and Path("/tmp/kani-release-ref.txt").exists()
              and read_optional("/tmp/kani-release-ref.txt").split()[0]==os.environ["EXPECTED_KANI_RELEASE_COMMIT_SHA"]
              and Path("/tmp/kani-crate-sha256.txt").exists()
              and Path("/tmp/kani-registry-checksum.txt").exists()
              and read_optional("/tmp/kani-crate-sha256.txt")==read_optional("/tmp/kani-registry-checksum.txt")
              and ("commit-hash: "+os.environ["EXPECTED_KANI_RUST_COMMIT_HASH"]) in read_optional("/tmp/kani-rustc.txt","")
          )

          receipt={
              "schema":"xenia.formal.kani-replay-kernel.trusted-admission.v1",
              "verifier_workflow_path":os.environ["VERIFIER_WORKFLOW_PATH"],
              "verifier_workflow_commit":os.environ["GITHUB_SHA"],
              "verifier_workflow_blob":read_optional("/tmp/verifier-workflow.blob"),
              "trigger_workflow_blob":read_optional("/tmp/trigger-workflow.blob"),
              "github_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "github_run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "triggering_run_id":int(os.environ["TRIGGER_RUN_ID"]),
              "triggering_run_attempt":int(os.environ["TRIGGER_RUN_ATTEMPT"]),
              "triggering_conclusion":os.environ["TRIGGER_CONCLUSION"],
              "triggering_workflow":"XEN-KANI-FV-002 Replay Kernel",
              "triggering_workflow_path":os.environ["EXPECTED_TRIGGER_WORKFLOW_PATH"],
              "triggering_branch":os.environ["HEAD_BRANCH"],
              "triggering_workflow_id":int(os.environ["EXPECTED_TRIGGER_WORKFLOW_ID"]),
              "pr_number":int(os.environ["PR_NUMBER"]),
              "head_sha":os.environ["HEAD_SHA"],
              "head_repo":os.environ["HEAD_REPO"],
              "head_repo_expected":os.environ["EXPECTED_HEAD_REPO"],
              "final_pr_freshness_sha256":(
                  __import__("hashlib").sha256(
                      Path("/tmp/final-pr-freshness.txt").read_bytes()
                  ).hexdigest()
                  if Path("/tmp/final-pr-freshness.txt").exists() else None
              ),
              "final_pr_freshness_verified":Path("/tmp/final-pr-freshness.txt").exists(),
              "base_sha_anchor":os.environ["BASE_SHA"],
              "pr_base_ref":"main",
              "kernel_blob":read_optional("/tmp/xen-kani-trusted/kernel.blob"),
              "kernel_blob_expected":os.environ["EXPECTED_KERNEL_BLOB"],
              "kernel_frozen_binding":read_optional("/tmp/xen-kani-trusted/kernel.blob")==os.environ["EXPECTED_KERNEL_BLOB"],
              "proof_blob":read_optional("/tmp/xen-kani-trusted/proof.blob"),
              "proof_blob_expected":os.environ["EXPECTED_PROOF_BLOB"],
              "proof_frozen_binding":read_optional("/tmp/xen-kani-trusted/proof.blob")==os.environ["EXPECTED_PROOF_BLOB"],
              "evidence_contract_blob":read_optional("/tmp/xen-kani-trusted/evidence.blob"),
              "evidence_contract_blob_expected":os.environ["EXPECTED_EVIDENCE_CONTRACT_BLOB"],
              "evidence_contract_frozen_binding":read_optional("/tmp/xen-kani-trusted/evidence.blob")==os.environ["EXPECTED_EVIDENCE_CONTRACT_BLOB"],
              "reachability_cover_source_sha256":(
                  __import__("hashlib").sha256(
                      Path("/tmp/xen-kani-trusted/src/replay_kernel_cover.rs").read_bytes()
                  ).hexdigest()
                  if Path("/tmp/xen-kani-trusted/src/replay_kernel_cover.rs").exists() else None
              ),
              "reachability_manifest_sha256":(
                  __import__("hashlib").sha256(
                      Path("/tmp/trusted-reachability-manifest.json").read_bytes()
                  ).hexdigest()
                  if Path("/tmp/trusted-reachability-manifest.json").exists() else None
              ),
              "qualified_kernel_commit_sha":os.environ["EXPECTED_QUALIFIED_HEAD_SHA"],
              "reachability_harness_count":6,
              "reachability_all_satisfied":reachability_ok,
              "hostile_cover_control_exit_status":int(read_optional("/tmp/cover-hostile.exit", "125")),
              "hostile_cover_control_structured_result":Path("/tmp/cover-hostile.json").exists(),
              "hostile_cover_mutant_kernel_blob":read_optional("/tmp/hostile-cover-mutant-kernel.blob"),
              "hostile_cover_restored_kernel_blob":read_optional("/tmp/hostile-cover-restored-kernel.blob"),
              "hostile_cover_restored_binding":(
                  read_optional("/tmp/hostile-cover-restored-kernel.blob")==read_optional("/tmp/xen-kani-trusted/kernel.blob")
                  if Path("/tmp/hostile-cover-restored-kernel.blob").exists() and Path("/tmp/xen-kani-trusted/kernel.blob").exists()
                  else False
              ),
              "clean_proof_manifest_sha256":(
                  __import__("hashlib").sha256(
                      Path("/tmp/trusted-clean-manifest.json").read_bytes()
                  ).hexdigest()
                  if Path("/tmp/trusted-clean-manifest.json").exists() else None
              ),
              "clean_proof_all_success":clean_proofs_ok,
              "authority_eligible":authority_eligible,
              "base_tree_sha":Path("/tmp/base-tree-sha").read_text().strip() if Path("/tmp/base-tree-sha").exists() else None,
              "head_tree_sha":Path("/tmp/head-tree-sha").read_text().strip() if Path("/tmp/head-tree-sha").exists() else None,
              "complete_tree_delta_verified":Path("/tmp/trusted-tree-delta.txt").exists(),
              "kani_version":read_optional("/tmp/kani-version.txt"),
              "expected_cbmc_version":os.environ["EXPECTED_KANI_CBMC_VERSION"],
              "cbmc_version_verified":("CBMC "+os.environ["EXPECTED_KANI_CBMC_VERSION"]) in read_optional("/tmp/kani-version.txt",""),
              "expected_kani_release_tag":os.environ["EXPECTED_KANI_RELEASE_TAG"],
              "expected_kani_release_commit_sha":os.environ["EXPECTED_KANI_RELEASE_COMMIT_SHA"],
              "kani_release_tag_commit_verified":Path("/tmp/kani-release-ref.txt").exists() and read_optional("/tmp/kani-release-ref.txt").split()[0]==os.environ["EXPECTED_KANI_RELEASE_COMMIT_SHA"],
              "kani_crate_sha256":read_optional("/tmp/kani-crate-sha256.txt"),
              "kani_registry_checksum":read_optional("/tmp/kani-registry-checksum.txt"),
              "kani_registry_checksum_verified":Path("/tmp/kani-crate-sha256.txt").exists() and Path("/tmp/kani-registry-checksum.txt").exists() and read_optional("/tmp/kani-crate-sha256.txt")==read_optional("/tmp/kani-registry-checksum.txt"),
              "kani_rust_binding_verified":(
                  ("commit-hash: "+os.environ["EXPECTED_KANI_RUST_COMMIT_HASH"])
                  in read_optional("/tmp/kani-rustc.txt","")
              ),
              "kani_rust_toolchain":os.environ["EXPECTED_KANI_RUST_TOOLCHAIN"],
              "kani_rust_commit_hash":os.environ["EXPECTED_KANI_RUST_COMMIT_HASH"],
              "clean_harness_count":14,
              "hostile_control_exit_status":int(read_optional("/tmp/hostile.exit", "125")),
              "hostile_control_structured_failure":Path("/tmp/hostile.json").exists(),
              "hostile_mutant_kernel_blob":read_optional("/tmp/hostile-mutant-kernel.blob"),
              "hostile_restored_kernel_blob":read_optional("/tmp/hostile-restored-kernel.blob"),
              "hostile_restored_binding":(
                  read_optional("/tmp/hostile-restored-kernel.blob")==read_optional("/tmp/xen-kani-trusted/kernel.blob")
                  if Path("/tmp/hostile-restored-kernel.blob").exists() and Path("/tmp/xen-kani-trusted/kernel.blob").exists()
                  else False
              ),
          }
          Path("/tmp/trusted-admission.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(Path("/tmp/trusted-admission.json").read_text())
          if not authority_eligible:
              raise SystemExit("authority eligibility predicate is false")
          PY

      - name: Verify trusted evidence inventory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            /tmp/trusted-subject.txt
            /tmp/verifier-workflow.txt
            /tmp/verifier-workflow.blob
            /tmp/trigger-workflow.txt
            /tmp/trigger-workflow.blob
            /tmp/trigger-run.json
            /tmp/base-tree-sha
            /tmp/head-tree-sha
            /tmp/trusted-tree-delta.txt
            /tmp/trusted-reachability-manifest.json
            /tmp/cover-hostile.json
            /tmp/hostile-cover-mutant-kernel.blob
            /tmp/hostile-cover-restored-kernel.blob
            /tmp/xen-kani-trusted/src/replay_kernel_cover.rs
            /tmp/cover-harnesses.txt
            /tmp/trusted-clean-manifest.json
            /tmp/xen-kani-trusted/kernel.blob
            /tmp/xen-kani-trusted/proof.blob
            /tmp/xen-kani-trusted/evidence.blob
            /tmp/xen-kani-trusted/evidence.json
            /tmp/kani-version.txt
            /tmp/kani-rustc.txt
            /tmp/kani-release-ref.txt
            /tmp/kani-crates-io.json
            /tmp/kani-crate-sha256.txt
            /tmp/kani-registry-checksum.txt
            /tmp/trusted-admission.json
            /tmp/final-pr.json
            /tmp/final-pr-freshness.txt
            /tmp/hostile.json
            /tmp/hostile.log
            /tmp/hostile.exit
            /tmp/hostile-mutant-kernel.blob
            /tmp/hostile-restored-kernel.blob
          )
          for path in "${required_files[@]}"; do
            test -s "$path"
          done
          test "$(find /tmp -maxdepth 1 -type f -name 'kernel_*.json' | wc -l)" -eq 14
          test "$(find /tmp -maxdepth 1 -type f -name 'cover_*.json' | wc -l)" -eq 7
          test "$(find /tmp -maxdepth 1 -type f -name 'cover_*.log' | wc -l)" -eq 7
          test "$(find /tmp -maxdepth 1 -type f -name 'cover_*.exit' | wc -l)" -eq 7

      - name: Upload trusted evidence
        id: trusted-evidence-upload
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trusted-xen-kani-fv-002-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
          path: |
            /tmp/trusted-subject.txt
            /tmp/verifier-workflow.txt
            /tmp/verifier-workflow.blob
            /tmp/trigger-workflow.txt
            /tmp/trigger-workflow.blob
            /tmp/trigger-run.json
            /tmp/base-tree-sha
            /tmp/head-tree-sha
            /tmp/trusted-tree-delta.txt
            /tmp/trusted-reachability-manifest.json
            /tmp/cover_*.json
            /tmp/cover_*.log
            /tmp/cover_*.exit
            /tmp/cover-hostile.json
            /tmp/cover-hostile.log
            /tmp/cover-hostile.exit
            /tmp/hostile-cover-mutant-kernel.blob
            /tmp/hostile-cover-restored-kernel.blob
            /tmp/xen-kani-trusted/src/replay_kernel_cover.rs
            /tmp/cover-harnesses.txt
            /tmp/trusted-clean-manifest.json
            /tmp/kernel_*.json
            /tmp/xen-kani-trusted/kernel.blob
            /tmp/xen-kani-trusted/proof.blob
            /tmp/xen-kani-trusted/evidence.blob
            /tmp/xen-kani-trusted/evidence.json
            /tmp/kani-version.txt
            /tmp/kani-rustc.txt
            /tmp/trusted-admission.json
            /tmp/final-pr.json
            /tmp/final-pr-freshness.txt
            /tmp/hostile.json
            /tmp/hostile.log
            /tmp/hostile.exit
            /tmp/hostile-mutant-kernel.blob
            /tmp/hostile-restored-kernel.blob
          if-no-files-found: error
          retention-days: 30
      - name: Verify trusted evidence upload identity
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.trusted-evidence-upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.trusted-evidence-upload.outputs.artifact-digest }}
          EXPECTED_ARTIFACT_NAME: trusted-xen-kani-fv-002-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test "$ARTIFACT_ID" != "0"
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/Luminous-Dynamics/xenia-wire/actions/artifacts/$ARTIFACT_ID"             -o /tmp/trusted-artifact.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          d=json.loads(Path("/tmp/trusted-artifact.json").read_text())
          assert d["id"] == int(os.environ["ARTIFACT_ID"])
          assert d["name"] == os.environ["EXPECTED_ARTIFACT_NAME"]
          assert d["digest"] == "sha256:"+os.environ["ARTIFACT_DIGEST"]
          assert d["workflow_run"]["id"] == int(os.environ["EXPECTED_RUN_ID"])
          assert d["workflow_run"]["head_sha"] == os.environ["HEAD_SHA"]
          assert d["expired"] is False
          Path("/tmp/trusted-artifact-provenance.txt").write_text(
              "artifact_id="+str(d["id"])+"\n"
              "artifact_name="+d["name"]+"\n"
              "artifact_digest="+d["digest"]+"\n"
              "workflow_run_id="+str(d["workflow_run"]["id"])+"\n"
              "workflow_run_head_sha="+d["workflow_run"]["head_sha"]+"\n"
          )
          PY
          cat /tmp/trusted-artifact-provenance.txt


      - name: Build authority terminal receipt
        if: success()
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.trusted-evidence-upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.trusted-evidence-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test "$ARTIFACT_ID" != "0"
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test -s /tmp/trusted-artifact.json
          python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path

          receipt=json.loads(Path("/tmp/trusted-admission.json").read_text())
          artifact=json.loads(Path("/tmp/trusted-artifact.json").read_text())
          assert receipt["pre_transport_authority_eligible"] is True
          assert receipt["authority_eligible"] is False
          assert artifact["id"] == int(os.environ["ARTIFACT_ID"])
          assert artifact["digest"] == "sha256:"+os.environ["ARTIFACT_DIGEST"]
          assert artifact["workflow_run"]["id"] == int(os.environ["GITHUB_RUN_ID"])
          assert artifact["workflow_run"]["head_sha"] == os.environ["HEAD_SHA"]

          terminal=dict(receipt)
          terminal["schema"]="xenia.formal.kani-replay-kernel.authority-terminal.v1"
          terminal["authority_eligible"]=True
          terminal["evidence_artifact_id"]=artifact["id"]
          terminal["evidence_artifact_name"]=artifact["name"]
          terminal["evidence_artifact_digest"]=artifact["digest"]
          terminal["evidence_artifact_verified"]=True
          terminal["pre_transport_receipt_sha256"]=hashlib.sha256(
              Path("/tmp/trusted-admission.json").read_bytes()
          ).hexdigest()
          Path("/tmp/authority-terminal.json").write_text(
              json.dumps(terminal,indent=2,sort_keys=True)+"\n"
          )
          PY
          cat /tmp/authority-terminal.json

      - name: Upload authority terminal
        if: success()
        id: authority-terminal-upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trusted-xen-kani-fv-002-authority-terminal-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
          path: /tmp/authority-terminal.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify authority terminal upload identity
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.authority-terminal-upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.authority-terminal-upload.outputs.artifact-digest }}
          EXPECTED_ARTIFACT_NAME: trusted-xen-kani-fv-002-authority-terminal-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test "$ARTIFACT_ID" != "0"
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Luminous-Dynamics/xenia-wire/actions/artifacts/$ARTIFACT_ID" \
            -o /tmp/authority-terminal-artifact.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          d=json.loads(Path("/tmp/authority-terminal-artifact.json").read_text())
          assert d["id"] == int(os.environ["ARTIFACT_ID"])
          assert d["name"] == os.environ["EXPECTED_ARTIFACT_NAME"]
          assert d["digest"] == "sha256:"+os.environ["ARTIFACT_DIGEST"]
          assert d["workflow_run"]["id"] == int(os.environ["EXPECTED_RUN_ID"])
          assert d["workflow_run"]["head_sha"] == os.environ["HEAD_SHA"]
          assert d["expired"] is False
          PY
          echo "authority terminal artifact verified: $ARTIFACT_ID sha256:$ARTIFACT_DIGEST"
