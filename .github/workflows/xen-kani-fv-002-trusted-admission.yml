      - name: Install pinned Kani for self-test
        shell: bash
        run: |
          set -euo pipefail
          # Verify the registry archive before compiling any of its code.
          curl --fail-with-body --silent --show-error \\
            -H "Accept: application/json" \\
            "https://crates.io/api/v1/crates/kani-verifier/0.68.0" \\
            -o /tmp/kani-crates-io.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          api=json.loads(Path("/tmp/kani-crates-io.json").read_text())
          matches=[x for x in api.get("versions",[]) if x.get("num")=="0.68.0"]
          assert len(matches)==1
          checksum=matches[0].get("checksum")
          assert isinstance(checksum,str) and len(checksum)==64
          assert checksum==os.environ["EXPECTED_KANI_CRATE_SHA256"]
          Path("/tmp/kani-registry-checksum.txt").write_text(checksum+"\n")
          PY
          curl --fail-with-body --silent --show-error --location \\
            -H "Accept: application/octet-stream" \\
            "https://crates.io/api/v1/crates/kani-verifier/0.68.0/download" \\
            -o /tmp/kani-verifier-0.68.0.crate
          sha256sum /tmp/kani-verifier-0.68.0.crate | cut -d" " -f1 > /tmp/kani-crate-sha256.txt
          test "$(cat /tmp/kani-crate-sha256.txt)" = "$(cat /tmp/kani-registry-checksum.txt)"
          test "$(cat /tmp/kani-crate-sha256.txt)" = "$EXPECTED_KANI_CRATE_SHA256"
          python3 - <<'PY'
          import tarfile
          from pathlib import Path, PurePosixPath

          archive=Path("/tmp/kani-verifier-0.68.0.crate")
          with tarfile.open(archive,"r:gz") as tf:
              members=tf.getmembers()
          assert members
          for member in members:
              name=PurePosixPath(member.name)
              assert not name.is_absolute() and ".." not in name.parts
              assert name.parts and name.parts[0]=="kani-verifier-0.68.0"
              assert member.isdir() or member.isfile() or member.issym() or member.islnk()
              if member.issym() or member.islnk():
                  target=PurePosixPath(member.linkname)
                  assert not target.is_absolute() and ".." not in target.parts
          PY
          rm -rf /tmp/kani-verifier-0.68.0
          mkdir -p /tmp/kani-verifier-0.68.0
          tar -xzf /tmp/kani-verifier-0.68.0.crate -C /tmp --no-same-owner --no-same-permissions
          test -f /tmp/kani-verifier-0.68.0/Cargo.toml
          extracted_manifest_sha256="$(sha256sum /tmp/kani-verifier-0.68.0/Cargo.toml | cut -d" " -f1)"
          archive_sha256="$(cat /tmp/kani-crate-sha256.txt)"
          printf "crate_archive_sha256=%s\nmanifest_sha256=%s\n" "$archive_sha256" "$extracted_manifest_sha256" > /tmp/kani-extraction-binding.txt
          test -n "$archive_sha256"
          test -n "$extracted_manifest_sha256"
          cargo install --locked --path /tmp/kani-verifier-0.68.0
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/model-checking/kani/releases/tags/$EXPECTED_KANI_RELEASE_TAG" \
            -o /tmp/kani-release.json
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          release=json.loads(Path("/tmp/kani-release.json").read_text())
          assert release["tag_name"]==os.environ["EXPECTED_KANI_RELEASE_TAG"]
          candidates=[
              asset for asset in release.get("assets",[])
              if asset.get("id")==int(os.environ["EXPECTED_KANI_RELEASE_ASSET_ID"])
              and asset.get("name")==os.environ["EXPECTED_KANI_RELEASE_ASSET_NAME"]
              and asset.get("state")=="uploaded"
          ]
          assert len(candidates)==1
          asset=candidates[0]
          digest=asset.get("digest")
          assert digest==os.environ["EXPECTED_KANI_RELEASE_ASSET_DIGEST"]
          url=asset["browser_download_url"]
          parsed=urlparse(url)
          assert parsed.scheme=="https" and parsed.netloc=="github.com"
          assert parsed.query=="" and parsed.fragment==""
          expected_path="/model-checking/kani/releases/download/"+release["tag_name"]+"/"+asset["name"]
          assert parsed.path==expected_path
          request=urllib.request.Request(url,headers={"Accept":"application/octet-stream","User-Agent":"xenia-wire-trusted-admission"})
          with urllib.request.urlopen(request) as response, open("/tmp/kani-release-bundle.tar.gz","wb") as out:
              while True:
                  chunk=response.read(1024*1024)
                  if not chunk: break
                  out.write(chunk)
          actual="sha256:"+hashlib.sha256(Path("/tmp/kani-release-bundle.tar.gz").read_bytes()).hexdigest()
          assert actual==digest
          Path("/tmp/kani-release-asset.txt").write_text("release_tag="+release["tag_name"]+"\nasset_id="+str(asset["id"])+"\nasset_name="+asset["name"]+"\nasset_digest="+digest+"\nasset_url="+url+"\n")
          Path("/tmp/kani-release-bundle-sha256.txt").write_text(actual+"\n")
          print(Path("/tmp/kani-release-asset.txt").read_text())
          print("Kani release bundle digest verified: "+actual)
          PY
          test -s /tmp/kani-release-bundle.tar.gz
          cargo kani setup --use-local-bundle /tmp/kani-release-bundle.tar.gz
          cargo kani --version --verbose | tee /tmp/selftest-kani-version.txt
          grep -q "Kani Rust Verifier 0.68.0" /tmp/selftest-kani-version.txt
          grep -q "CBMC 6.11.0" /tmp/selftest-kani-version.txt
          rustup run "$EXPECTED_KANI_RUST_TOOLCHAIN" rustc -Vv | tee /tmp/selftest-kani-rustc.txt
          grep -q "commit-hash: $EXPECTED_KANI_RUST_COMMIT_HASH" /tmp/selftest-kani-rustc.txt
      - name: Execute all trusted cover witnesses as non-authoritative self-test
        working-directory: /tmp/xen-kani-selftest
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          cat > /tmp/selftest-covers.txt <<'EOF'
          cover_initialization_reachable
          cover_advance_shift_reachable
          cover_in_window_replay_mark_reachable
          cover_exact_window_boundary_reachable
          cover_stale_boundary_rejection_reachable
          cover_exact_window_jump_reset_reachable
          EOF
          while IFS= read -r harness; do
            set +e
            cargo kani -Z unstable-options --tests --default-unwind 20 \
              --harness "$harness" \
              --export-json "/tmp/selftest-$harness.json" \
              > "/tmp/selftest-$harness.log" 2>&1
            status=$?
            set -e
            cat "/tmp/selftest-$harness.log"
            test "$status" -eq 0
            python3 - "$harness" "/tmp/selftest-$harness.json" <<'PY'
          import json,sys,re
          from pathlib import Path
          harness=sys.argv[1]
          def normalize_description(value):
              return re.sub(r"\s+", " ", str(value)).strip()
          d=json.loads(Path(sys.argv[2]).read_text())
          expected_descriptions={
              "cover_initialization_reachable":"cover condition: accepted && state.initialized && state.highest == seq && state.bitmap[0] == 1",
              "cover_advance_shift_reachable":"cover condition: accepted && state.highest == 101 && state.bitmap[0] & 3 == 3",
              "cover_in_window_replay_mark_reachable":"cover condition: accepted && state.highest == 100 && state.bitmap[0] & 2 == 2",
              "cover_exact_window_boundary_reachable":"cover condition: accepted && state.highest == 100 && state.bitmap[0] & (1u64 << 63) != 0",
              "cover_stale_boundary_rejection_reachable":"cover condition: !accepted && state.highest == 100",
              "cover_exact_window_jump_reset_reachable":"cover condition: accepted && state.highest == 164 && state.bitmap[0] == 1 && state.bitmap[1] == 0",
          }
          vr=d.get("verification_results",{})
          rs=vr.get("results",[]) if isinstance(vr,dict) else []
          c=[x for x in rs if isinstance(x,dict) and (x.get("harness_id")==harness or str(x.get("harness_id","")).endswith("::"+harness))]
          assert len(c)==1
          checks=[x for x in c[0].get("checks",[]) if isinstance(x,dict) and (".cover." in str(x.get("name","")) or str(x.get("description","")).startswith("cover condition:"))]
          assert len(checks)==1
          assert str(checks[0].get("status","")).upper()=="SATISFIED"
          assert normalize_description(checks[0].get("description"))==normalize_description(expected_descriptions[harness])
          PY
          done < /tmp/selftest-covers.txt

      - name: Retain non-authoritative self-test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xen-kani-fv-002-reachability-selftest-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/replay_kernel_cover.rs
            /tmp/selftest-replay_kernel.rs
            /tmp/selftest-replay-kernel.blob
            /tmp/selftest-covers.txt
            /tmp/selftest-kani-version.txt
            /tmp/selftest-kani-rustc.txt
            /tmp/kani-verifier-0.68.0.crate
            /tmp/selftest-*.json
            /tmp/selftest-*.log
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false

  trusted-admission:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != null && github.event.workflow_run.head_branch == 'formal/xen-kani-fv-002-replay-kernel' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Prepare trusted verifier workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xen-kani-trusted/src
          cat > /tmp/xen-kani-trusted/Cargo.toml <<'EOF'
          [package]
          name = "xen_kani_trusted_subject"
          version = "0.1.0"
          edition = "2021"
          EOF

      - name: Verify trusted event envelope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_run"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$GITHUB_REPOSITORY" = "$EXPECTED_HEAD_REPO"
          test "$GITHUB_REPOSITORY_ID" = "$EXPECTED_HEAD_REPO_ID"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$VERIFIER_WORKFLOW_PATH@refs/heads/main"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$TRIGGER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TRIGGER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$HEAD_REPO" = "$EXPECTED_HEAD_REPO"
          test "$HEAD_BRANCH" = "$EXPECTED_TRIGGER_BRANCH"
          test "$HEAD_SHA" = "$EXPECTED_QUALIFIED_HEAD_SHA"
          test "$TRIGGER_CONCLUSION" = "success"
          test -f "$GITHUB_EVENT_PATH"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          import shutil
          event_path=Path(os.environ["GITHUB_EVENT_PATH"])
          shutil.copyfile(event_path, "/tmp/trusted-workflow-run-event.json")
          event=json.loads(event_path.read_text())
          assert event["action"]=="completed"
          assert event["repository"]["full_name"]==os.environ["EXPECTED_HEAD_REPO"]
          assert event["repository"]["id"]==int(os.environ["EXPECTED_HEAD_REPO_ID"])
          run=event["workflow_run"]
          assert run["id"]==int(os.environ["TRIGGER_RUN_ID"])
          assert run["run_attempt"]==int(os.environ["TRIGGER_RUN_ATTEMPT"])
          assert run["id"]==int(os.environ["TRIGGER_RUN_ID"])
          assert run["name"]=="XEN-KANI-FV-002 Replay Kernel"
          assert run["repository"]["id"]==int(os.environ["EXPECTED_HEAD_REPO_ID"])
          assert run["path"]==os.environ["EXPECTED_TRIGGER_WORKFLOW_PATH"]
          assert run["workflow_id"]==int(os.environ["EXPECTED_TRIGGER_WORKFLOW_ID"])
          assert run["event"]=="pull_request"
          assert run["conclusion"]=="success"
          assert run["head_branch"]==os.environ["EXPECTED_TRIGGER_BRANCH"]
          assert run["head_sha"]==os.environ["HEAD_SHA"]
          assert run["head_sha"]==os.environ["EXPECTED_QUALIFIED_HEAD_SHA"]
          assert run["head_commit"]["id"]==os.environ["HEAD_SHA"]
          assert run["head_repository"]["full_name"]==os.environ["HEAD_REPO"]
          pull_requests=run.get("pull_requests",[])
          assert len(pull_requests)==1
          assert pull_requests[0]["number"]==int(os.environ["PR_NUMBER"])
          assert pull_requests[0]["base"]["repo"]["id"]==int(os.environ["EXPECTED_HEAD_REPO_ID"])
          assert pull_requests[0]["head"]["repo"]["id"]==int(os.environ["EXPECTED_HEAD_REPO_ID"])
          assert pull_requests[0]["head"]["sha"]==os.environ["HEAD_SHA"]
          assert pull_requests[0]["head"]["ref"]==os.environ["HEAD_BRANCH"]
          assert pull_requests[0]["head"]["repo"]["full_name"]==os.environ["HEAD_REPO"]
          assert pull_requests[0]["base"]["ref"]=="main"
          assert pull_requests[0]["base"]["repo"]["full_name"]==os.environ["EXPECTED_HEAD_REPO"]
          print("raw workflow_run event payload binding passed")
          PY

      - name: Verify trusted verifier workflow identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$EXPECTED_HEAD_REPO/actions/runs/$GITHUB_RUN_ID" \
            -o /tmp/verifier-run.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          d=json.loads(Path("/tmp/verifier-run.json").read_text())
          assert d["id"]==int(os.environ["GITHUB_RUN_ID"])
          assert d["workflow_id"]==int(os.environ["EXPECTED_VERIFIER_WORKFLOW_ID"])
          assert d["name"]=="Trusted XEN-KANI-FV-002 Admission"
          assert d["path"]==os.environ["VERIFIER_WORKFLOW_PATH"]
          assert d["event"]=="workflow_run"
          assert d["head_branch"]=="main"
          assert d["head_sha"]==os.environ["GITHUB_SHA"]
          assert os.environ["GITHUB_WORKFLOW_SHA"]==os.environ["GITHUB_SHA"]
          assert os.environ["GITHUB_WORKFLOW_REF"]==os.environ["GITHUB_REPOSITORY"]+"/"+os.environ["VERIFIER_WORKFLOW_PATH"]+"@refs/heads/main"
          assert d["head_branch"]=="main"
          assert d["head_sha"]==os.environ["GITHUB_SHA"]
          PY
          curl --fail-with-body --silent --show-error \\
            -H "Authorization: Bearer $GITHUB_TOKEN" \\
            -H "Accept: application/vnd.github+json" \\
            "https://api.github.com/repos/$EXPECTED_HEAD_REPO/branches/main" \\
            -o /tmp/main-branch.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          main_branch=json.loads(Path("/tmp/main-branch.json").read_text())
          assert os.environ["GITHUB_REF_PROTECTED"]=="true"
          assert main_branch["name"]=="main"
          assert main_branch["protected"] is True
          assert main_branch["commit"]["sha"]==os.environ["GITHUB_SHA"]
          assert main_branch["commit"]["commit"]["verification"]["verified"] is True
          assert main_branch["commit"]["commit"]["verification"]["reason"]=="valid"
          print("default branch protection, signed tip, and tip binding verified")
          PY
          curl --fail-with-body --silent --show-error \\
            -H "Authorization: Bearer $GITHUB_TOKEN" \\
            -H "Accept: application/vnd.github.raw+json" \\
            "https://api.github.com/repos/$EXPECTED_HEAD_REPO/contents/$VERIFIER_WORKFLOW_PATH?ref=$GITHUB_SHA" \\
            -o /tmp/trusted-verifier-workflow.yml
          verifier_blob="$(git hash-object /tmp/trusted-verifier-workflow.yml)"
          printf '%s\\n' "$verifier_blob" > /tmp/verifier-workflow.blob
          printf 'verifier_commit=%s\\nverifier_workflow_blob=%s\\n' "$GITHUB_SHA" "$verifier_blob" | tee /tmp/verifier-workflow.txt
          test -s /tmp/trusted-verifier-workflow.yml

      - name: Verify triggering workflow identity and provenance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/Luminous-Dynamics/xenia-wire/actions/runs/$TRIGGER_RUN_ID"             -o /tmp/trigger-run.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path("/tmp/trigger-run.json").read_text())
          assert d["id"]==int(os.environ["TRIGGER_RUN_ID"])
          assert d["repository"]["id"]==int(os.environ["EXPECTED_HEAD_REPO_ID"])
          assert d["run_attempt"]==int(os.environ["TRIGGER_RUN_ATTEMPT"])
          assert d["name"]=="XEN-KANI-FV-002 Replay Kernel"
          assert d["path"]==os.environ["EXPECTED_TRIGGER_WORKFLOW_PATH"]
          assert d["workflow_id"]==int(os.environ["EXPECTED_TRIGGER_WORKFLOW_ID"])
          assert d["head_branch"]==os.environ["EXPECTED_TRIGGER_BRANCH"]
          assert d["event"]=="pull_request"
          assert d["head_sha"]==os.environ["HEAD_SHA"]
          assert d["head_sha"]==os.environ["EXPECTED_QUALIFIED_HEAD_SHA"]
          assert d["head_repository"]["full_name"]==os.environ["HEAD_REPO"]
          assert d["head_repository"]["id"]==int(os.environ["EXPECTED_HEAD_REPO_ID"])
          assert os.environ["HEAD_REPO"]==os.environ["EXPECTED_HEAD_REPO"]
          pull_requests=d.get("pull_requests",[])
          assert len(pull_requests)==1, f"unexpected triggering PR cardinality: {len(pull_requests)}"
          assert pull_requests[0]["number"]==int(os.environ["PR_NUMBER"])
          assert d["conclusion"]==os.environ["TRIGGER_CONCLUSION"]
          PY

      - name: Verify triggering workflow source identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \\
            -H "Authorization: Bearer $GITHUB_TOKEN" \\
            -H "Accept: application/vnd.github.raw+json" \\
            "https://api.github.com/repos/$HEAD_REPO/contents/$EXPECTED_TRIGGER_WORKFLOW_PATH?ref=$HEAD_SHA" \\
            -o /tmp/trigger-workflow.yml
          trigger_blob="$(git hash-object /tmp/trigger-workflow.yml)"
          printf '%s\\n' "$trigger_blob" > /tmp/trigger-workflow.blob
          test "$trigger_blob" = "$EXPECTED_TRIGGER_WORKFLOW_BLOB"
          printf 'trigger_workflow_blob=%s\\n' "$trigger_blob" | tee /tmp/trigger-workflow.txt

      - name: Verify triggering PR identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/Luminous-Dynamics/xenia-wire/pulls/$PR_NUMBER"             -o /tmp/pr.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path("/tmp/pr.json").read_text())
          assert d["number"]==int(os.environ["PR_NUMBER"])
          assert d["base"]["repo"]["id"]==int(os.environ["EXPECTED_HEAD_REPO_ID"])
          assert d["head"]["repo"]["id"]==int(os.environ["EXPECTED_HEAD_REPO_ID"])
          assert d["state"]=="open"
          assert d["merged"] is False
          assert d["base"]["ref"]=="main"
          assert d["base"]["repo"]["full_name"]==os.environ["EXPECTED_HEAD_REPO"]
          assert d["head"]["ref"]==os.environ["HEAD_BRANCH"]
          assert d["head"]["sha"]==os.environ["HEAD_SHA"]
          assert d["head"]["sha"]==os.environ["EXPECTED_QUALIFIED_HEAD_SHA"]
          assert d["head"]["repo"]["full_name"]==os.environ["EXPECTED_HEAD_REPO"]
          assert d["head"]["repo"]["full_name"]==os.environ["HEAD_REPO"]
          PY

      - name: Reject trusted-verifier self-modification
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          pr=json.loads(Path("/tmp/pr.json").read_text())
          changed_files=pr.get("changed_files")
          assert isinstance(changed_files,int) and 0 < changed_files <= 100, (
              f"trusted self-modification scope requires 1..100 changed files, got {changed_files!r}"
          )
          PY
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/Luminous-Dynamics/xenia-wire/pulls/$PR_NUMBER/files?per_page=100&page=1"             -o /tmp/pr-files.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          pr=json.loads(Path("/tmp/pr.json").read_text())
          files=json.loads(Path("/tmp/pr-files.json").read_text())
          assert isinstance(files,list)
          assert len(files)==pr["changed_files"], (
              f"PR file-list pagination incomplete: metadata={pr['changed_files']} returned={len(files)}"
          )
          paths=[]
          for item in files:
              filename=item.get("filename")
              assert isinstance(filename,str) and filename, "PR file entry missing filename"
              paths.append(filename)
              previous_filename=item.get("previous_filename")
              assert previous_filename is None or (
                  isinstance(previous_filename,str) and previous_filename
              ), "PR rename entry has invalid previous_filename"
              if previous_filename:
                  paths.append(previous_filename)
          verifier_path=os.environ["VERIFIER_WORKFLOW_PATH"]
          assert verifier_path not in paths, (
              f"trusted verifier self-modification is not authority-eligible: {verifier_path}"
          )
          print("trusted verifier self-modification fence passed")
          PY

      - name: Fetch PR replay kernel as data
        id: fetch-subject
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github.raw+json"             "https://api.github.com/repos/$HEAD_REPO/contents/src/replay_kernel.rs?ref=$HEAD_SHA"             -o /tmp/xen-kani-trusted/src/replay_kernel.rs
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github.raw+json"             "https://api.github.com/repos/$HEAD_REPO/contents/src/replay_kernel_kani.rs?ref=$HEAD_SHA"             -o /tmp/xen-kani-trusted/src/replay_kernel_kani.rs
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github.raw+json"             "https://api.github.com/repos/$HEAD_REPO/contents/docs/formal/xen-kani-fv-002-replay-kernel-v1.json?ref=$HEAD_SHA"             -o /tmp/xen-kani-trusted/evidence.json

          cat > /tmp/xen-kani-trusted/src/lib.rs <<'EOF'
          #![forbid(unsafe_code)]
          mod replay_kernel;
          #[cfg(kani)]
          #[path = "replay_kernel_kani.rs"]
          mod replay_kernel_kani;
          #[cfg(kani)]
          #[path = "replay_kernel_cover.rs"]
          mod replay_kernel_cover;
          EOF

          cat > /tmp/xen-kani-trusted/src/replay_kernel_cover.rs <<'EOF'
          //! Trusted reachability witnesses for the frozen replay transition kernel.
          //!
          //! This source is generated by the trusted verifier workflow rather than
          //! fetched from the pull request. It contains reachability-only cover
          //! checks and does not add a production safety claim.
          use crate::replay_kernel::{ReplayState, transition};

          #[kani::proof]
          #[kani::unwind(20)]
          fn cover_initialization_reachable() {
              let mut state = ReplayState::new();
              let seq: u64 = kani::any();
              let accepted = transition(&mut state, 64, seq);
              kani::cover!(accepted && state.initialized && state.highest == seq && state.bitmap[0] == 1);
          }

          #[kani::proof]
          #[kani::unwind(20)]
          fn cover_advance_shift_reachable() {
              let mut state = ReplayState::new();
              transition(&mut state, 64, 100);
              let accepted = transition(&mut state, 64, 101);
              kani::cover!(accepted && state.highest == 101 && state.bitmap[0] & 3 == 3);
          }

          #[kani::proof]
          #[kani::unwind(20)]
          fn cover_in_window_replay_mark_reachable() {
              let mut state = ReplayState::new();
              transition(&mut state, 64, 100);
              let accepted = transition(&mut state, 64, 99);
              kani::cover!(accepted && state.highest == 100 && state.bitmap[0] & 2 == 2);
          }

          #[kani::proof]
          #[kani::unwind(20)]
          fn cover_exact_window_boundary_reachable() {
              let mut state = ReplayState::new();
              transition(&mut state, 64, 100);
              let accepted = transition(&mut state, 64, 37);
              kani::cover!(accepted && state.highest == 100 && state.bitmap[0] & (1u64 << 63) != 0);
          }

          #[kani::proof]
          #[kani::unwind(20)]
          fn cover_stale_boundary_rejection_reachable() {
              let mut state = ReplayState::new();
              transition(&mut state, 64, 100);
              let accepted = transition(&mut state, 64, 36);
              kani::cover!(!accepted && state.highest == 100);
          }

          #[kani::proof]
          #[kani::unwind(20)]
          fn cover_exact_window_jump_reset_reachable() {
              let mut state = ReplayState::new();
              transition(&mut state, 64, 100);
              let accepted = transition(&mut state, 64, 164);
              kani::cover!(
                  accepted
                      && state.highest == 164
                      && state.bitmap[0] == 1
                      && state.bitmap[1] == 0
              );
          }
          EOF
          cat > /tmp/cover-harnesses.txt <<'EOF'
          cover_initialization_reachable
          cover_advance_shift_reachable
          cover_in_window_replay_mark_reachable
          cover_exact_window_boundary_reachable
          cover_stale_boundary_rejection_reachable
          cover_exact_window_jump_reset_reachable
          EOF
          cargo generate-lockfile --offline
          test -s /tmp/xen-kani-trusted/Cargo.lock
          printf '%s\n' "$HEAD_SHA" > /tmp/xen-kani-trusted/head.sha
          printf '%s\n' "$PR_NUMBER" > /tmp/xen-kani-trusted/pr.number

          blob_sha="$(git hash-object /tmp/xen-kani-trusted/src/replay_kernel.rs)"
          proof_blob_sha="$(git hash-object /tmp/xen-kani-trusted/src/replay_kernel_kani.rs)"
          evidence_blob_sha="$(git hash-object /tmp/xen-kani-trusted/evidence.json)"
          printf '%s\n' "$blob_sha" > /tmp/xen-kani-trusted/kernel.blob
          printf '%s\n' "$proof_blob_sha" > /tmp/xen-kani-trusted/proof.blob
          printf '%s\n' "$evidence_blob_sha" > /tmp/xen-kani-trusted/evidence.blob
          printf 'head=%s\nrepo=%s\nblob=%s\n' "$HEAD_SHA" "$HEAD_REPO" "$blob_sha" | tee /tmp/trusted-subject.txt

          test -s /tmp/xen-kani-trusted/src/replay_kernel.rs
          test "$(wc -c < /tmp/xen-kani-trusted/src/replay_kernel.rs)" -gt 1000
          test "$blob_sha" = "$EXPECTED_KERNEL_BLOB"
          test "$proof_blob_sha" = "$EXPECTED_PROOF_BLOB"
          test "$evidence_blob_sha" = "$EXPECTED_EVIDENCE_CONTRACT_BLOB"

      - name: Verify PR scope independently
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/Luminous-Dynamics/xenia-wire/compare/$BASE_SHA...$HEAD_SHA"             -o /tmp/compare.json

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          d=json.loads(Path("/tmp/compare.json").read_text())
          expected={
              ".github/workflows/xen-kani-fv-002-replay-kernel-v2.yml",
              "Cargo.toml",
              "docs/formal/xen-kani-fv-002-replay-kernel-v1.json",
              "src/lib.rs",
              "src/replay_kernel.rs",
              "src/replay_kernel_kani.rs",
              "src/replay_window.rs",
          }
          observed={x["filename"] for x in d.get("files",[])}
          assert d["status"]=="ahead"
          assert d["base_commit"]["sha"]=="057dd03043b8863d8f8280abf333331cc9ddf317"
          assert d["merge_base_commit"]["sha"]==os.environ["BASE_SHA"], (
              f"trusted lineage mismatch: {d.get('merge_base_commit',{}).get('sha')}"
          )
          assert observed==expected, f"trusted scope mismatch: {sorted(observed)}"
          PY

      - name: Verify complete tree delta independently
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Luminous-Dynamics/xenia-wire/commits/$BASE_SHA" \
            -o /tmp/base-commit.json

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$HEAD_REPO/commits/$HEAD_SHA" \
            -o /tmp/head-commit.json

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          base=json.loads(Path("/tmp/base-commit.json").read_text())
          head=json.loads(Path("/tmp/head-commit.json").read_text())
          assert base["sha"]==os.environ["BASE_SHA"]
          assert head["sha"]==os.environ["HEAD_SHA"]
          Path("/tmp/base-tree-sha").write_text(base["commit"]["tree"]["sha"]+"\n")
          Path("/tmp/head-tree-sha").write_text(head["commit"]["tree"]["sha"]+"\n")
          PY

          BASE_TREE="$(cat /tmp/base-tree-sha)"
          HEAD_TREE="$(cat /tmp/head-tree-sha)"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Luminous-Dynamics/xenia-wire/git/trees/$BASE_TREE?recursive=1" \
            -o /tmp/base-tree.json

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$HEAD_REPO/git/trees/$HEAD_TREE?recursive=1" \
            -o /tmp/head-tree.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          base=json.loads(Path("/tmp/base-tree.json").read_text())
          head=json.loads(Path("/tmp/head-tree.json").read_text())

          assert base.get("truncated") is False, "base tree response truncated"
          assert head.get("truncated") is False, "head tree response truncated"

          def index(doc):
              return {
                  item["path"]:(item.get("mode"),item.get("type"),item.get("sha"))
                  for item in doc["tree"]
              }

          b=index(base)
          h=index(head)
          changed=sorted(path for path in set(b)|set(h) if b.get(path)!=h.get(path))
          expected=sorted({
              ".github/workflows/xen-kani-fv-002-replay-kernel-v2.yml",
              "Cargo.toml",
              "docs/formal/xen-kani-fv-002-replay-kernel-v1.json",
