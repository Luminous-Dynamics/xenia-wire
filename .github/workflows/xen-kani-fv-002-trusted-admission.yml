          import json, os, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def read_optional(path, default=None):
              p=Path(path)
              return p.read_text(errors="replace").strip() if p.exists() else default

          reachability_manifest=None
          if Path("/tmp/trusted-reachability-manifest.json").exists():
              reachability_manifest=json.loads(Path("/tmp/trusted-reachability-manifest.json").read_text())
          clean_manifest=None
          if Path("/tmp/trusted-clean-manifest.json").exists():
              clean_manifest=json.loads(Path("/tmp/trusted-clean-manifest.json").read_text())

          kernel_binding=(
              read_optional("/tmp/xen-kani-trusted/kernel.blob")==os.environ["EXPECTED_KERNEL_BLOB"]
          )
          proof_binding=(
              read_optional("/tmp/xen-kani-trusted/proof.blob")==os.environ["EXPECTED_PROOF_BLOB"]
          )
          evidence_binding=(
              read_optional("/tmp/xen-kani-trusted/evidence.blob")==os.environ["EXPECTED_EVIDENCE_CONTRACT_BLOB"]
          )
          reachability_ok=(
              reachability_manifest is not None
              and reachability_manifest.get("all_satisfied") is True
              and reachability_manifest.get("harness_count")==6
              and len(reachability_manifest.get("results",[]))==6
              and all(
                  isinstance(x,dict) and x.get("cover_status")=="SATISFIED"
                  for x in reachability_manifest.get("results",[])
              )
          )
          clean_proofs_ok=(
              clean_manifest is not None
              and clean_manifest.get("all_success") is True
              and clean_manifest.get("harness_count")==14
              and len(clean_manifest.get("results",[]))==14
              and all(
                  isinstance(x,dict)
                  and x.get("structured_status")=="SUCCESS"
                  and int(x.get("property_failed") or 0)==0
                  and int(x.get("property_unreachable") or 0)==0
                  and int(x.get("property_undetermined") or 0)==0
                  for x in clean_manifest.get("results",[])
              )
          )
          hostile_ok=(
              Path("/tmp/hostile.json").exists()
              and int(read_optional("/tmp/hostile.exit","125"))!=0
              and read_optional("/tmp/hostile-mutant-kernel.blob")!=read_optional("/tmp/xen-kani-trusted/kernel.blob")
              and read_optional("/tmp/hostile-restored-kernel.blob")==read_optional("/tmp/xen-kani-trusted/kernel.blob")
          )
          hostile_cover_ok=(
              Path("/tmp/cover-hostile.json").exists()
              and str(
                  json.loads(Path("/tmp/cover-hostile.json").read_text())
                  .get("verification_results",{})
                  .get("results",[{}])[0]
                  .get("harness_id","")
              ).endswith("::cover_initialization_reachable")
              if Path("/tmp/cover-hostile.json").exists() else False
          )
          authority_eligible=(
              read_optional("/tmp/final-pr-freshness.txt") is not None
              and kernel_binding
              and proof_binding
              and evidence_binding
              and reachability_ok
              and clean_proofs_ok
              and hostile_ok
              and read_optional("/tmp/hostile-cover-restored-kernel.blob")==read_optional("/tmp/xen-kani-trusted/kernel.blob")
              and ("CBMC "+os.environ["EXPECTED_KANI_CBMC_VERSION"]) in read_optional("/tmp/kani-version.txt","")
              and ("commit-hash: "+os.environ["EXPECTED_KANI_RUST_COMMIT_HASH"]) in read_optional("/tmp/kani-rustc.txt","")
          )

          receipt={
              "schema":"xenia.formal.kani-replay-kernel.trusted-admission.v1",
              "verifier_workflow_path":os.environ["VERIFIER_WORKFLOW_PATH"],
              "verifier_workflow_commit":os.environ["GITHUB_SHA"],
              "verifier_workflow_blob":read_optional("/tmp/verifier-workflow.blob"),
              "trigger_workflow_blob":read_optional("/tmp/trigger-workflow.blob"),
              "github_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "github_run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "triggering_run_id":int(os.environ["TRIGGER_RUN_ID"]),
              "triggering_run_attempt":int(os.environ["TRIGGER_RUN_ATTEMPT"]),
              "triggering_conclusion":os.environ["TRIGGER_CONCLUSION"],
              "triggering_workflow":"XEN-KANI-FV-002 Replay Kernel",
              "triggering_workflow_path":os.environ["EXPECTED_TRIGGER_WORKFLOW_PATH"],
              "triggering_branch":os.environ["HEAD_BRANCH"],
              "triggering_workflow_id":int(os.environ["EXPECTED_TRIGGER_WORKFLOW_ID"]),
              "pr_number":int(os.environ["PR_NUMBER"]),
              "head_sha":os.environ["HEAD_SHA"],
              "head_repo":os.environ["HEAD_REPO"],
              "head_repo_expected":os.environ["EXPECTED_HEAD_REPO"],
              "final_pr_freshness_sha256":(
                  __import__("hashlib").sha256(
                      Path("/tmp/final-pr-freshness.txt").read_bytes()
                  ).hexdigest()
                  if Path("/tmp/final-pr-freshness.txt").exists() else None
              ),
              "final_pr_freshness_verified":Path("/tmp/final-pr-freshness.txt").exists(),
              "base_sha_anchor":os.environ["BASE_SHA"],
              "pr_base_ref":"main",
              "kernel_blob":read_optional("/tmp/xen-kani-trusted/kernel.blob"),
              "kernel_blob_expected":os.environ["EXPECTED_KERNEL_BLOB"],
              "kernel_frozen_binding":read_optional("/tmp/xen-kani-trusted/kernel.blob")==os.environ["EXPECTED_KERNEL_BLOB"],
              "proof_blob":read_optional("/tmp/xen-kani-trusted/proof.blob"),
              "proof_blob_expected":os.environ["EXPECTED_PROOF_BLOB"],
              "proof_frozen_binding":read_optional("/tmp/xen-kani-trusted/proof.blob")==os.environ["EXPECTED_PROOF_BLOB"],
              "evidence_contract_blob":read_optional("/tmp/xen-kani-trusted/evidence.blob"),
              "evidence_contract_blob_expected":os.environ["EXPECTED_EVIDENCE_CONTRACT_BLOB"],
              "evidence_contract_frozen_binding":read_optional("/tmp/xen-kani-trusted/evidence.blob")==os.environ["EXPECTED_EVIDENCE_CONTRACT_BLOB"],
              "reachability_cover_source_sha256":(
                  __import__("hashlib").sha256(
                      Path("/tmp/xen-kani-trusted/src/replay_kernel_cover.rs").read_bytes()
                  ).hexdigest()
                  if Path("/tmp/xen-kani-trusted/src/replay_kernel_cover.rs").exists() else None
              ),
              "reachability_manifest_sha256":(
                  __import__("hashlib").sha256(
                      Path("/tmp/trusted-reachability-manifest.json").read_bytes()
                  ).hexdigest()
                  if Path("/tmp/trusted-reachability-manifest.json").exists() else None
              ),
              "qualified_kernel_commit_sha":os.environ["EXPECTED_QUALIFIED_HEAD_SHA"],
              "reachability_harness_count":6,
              "reachability_all_satisfied":reachability_ok,
              "hostile_cover_control_exit_status":int(read_optional("/tmp/cover-hostile.exit", "125")),
              "hostile_cover_control_structured_result":Path("/tmp/cover-hostile.json").exists(),
              "hostile_cover_mutant_kernel_blob":read_optional("/tmp/hostile-cover-mutant-kernel.blob"),
              "hostile_cover_restored_kernel_blob":read_optional("/tmp/hostile-cover-restored-kernel.blob"),
              "hostile_cover_restored_binding":(
                  read_optional("/tmp/hostile-cover-restored-kernel.blob")==read_optional("/tmp/xen-kani-trusted/kernel.blob")
                  if Path("/tmp/hostile-cover-restored-kernel.blob").exists() and Path("/tmp/xen-kani-trusted/kernel.blob").exists()
                  else False
              ),
              "clean_proof_manifest_sha256":(
                  __import__("hashlib").sha256(
                      Path("/tmp/trusted-clean-manifest.json").read_bytes()
                  ).hexdigest()
                  if Path("/tmp/trusted-clean-manifest.json").exists() else None
              ),
              "clean_proof_all_success":clean_proofs_ok,
              "authority_eligible":authority_eligible,
              "base_tree_sha":Path("/tmp/base-tree-sha").read_text().strip() if Path("/tmp/base-tree-sha").exists() else None,
              "head_tree_sha":Path("/tmp/head-tree-sha").read_text().strip() if Path("/tmp/head-tree-sha").exists() else None,
              "complete_tree_delta_verified":Path("/tmp/trusted-tree-delta.txt").exists(),
              "kani_version":read_optional("/tmp/kani-version.txt"),
              "expected_cbmc_version":os.environ["EXPECTED_KANI_CBMC_VERSION"],
              "cbmc_version_verified":("CBMC "+os.environ["EXPECTED_KANI_CBMC_VERSION"]) in read_optional("/tmp/kani-version.txt",""),
              "kani_rust_binding_verified":(
                  ("commit-hash: "+os.environ["EXPECTED_KANI_RUST_COMMIT_HASH"])
                  in read_optional("/tmp/kani-rustc.txt","")
              ),
              "kani_rust_toolchain":os.environ["EXPECTED_KANI_RUST_TOOLCHAIN"],
              "kani_rust_commit_hash":os.environ["EXPECTED_KANI_RUST_COMMIT_HASH"],
              "clean_harness_count":14,
              "hostile_control_exit_status":int(read_optional("/tmp/hostile.exit", "125")),
              "hostile_control_structured_failure":Path("/tmp/hostile.json").exists(),
              "hostile_mutant_kernel_blob":read_optional("/tmp/hostile-mutant-kernel.blob"),
              "hostile_restored_kernel_blob":read_optional("/tmp/hostile-restored-kernel.blob"),
              "hostile_restored_binding":(
                  read_optional("/tmp/hostile-restored-kernel.blob")==read_optional("/tmp/xen-kani-trusted/kernel.blob")
                  if Path("/tmp/hostile-restored-kernel.blob").exists() and Path("/tmp/xen-kani-trusted/kernel.blob").exists()
                  else False
              ),
          }
          Path("/tmp/trusted-admission.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(Path("/tmp/trusted-admission.json").read_text())
          PY

      - name: Upload trusted evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trusted-xen-kani-fv-002-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
          path: |
            /tmp/trusted-subject.txt
            /tmp/verifier-workflow.txt
            /tmp/verifier-workflow.blob
            /tmp/trigger-workflow.txt
            /tmp/trigger-workflow.blob
            /tmp/trigger-run.json
            /tmp/base-tree-sha
            /tmp/head-tree-sha
            /tmp/trusted-tree-delta.txt
            /tmp/trusted-reachability-manifest.json
            /tmp/cover_*.json
            /tmp/cover_*.log
            /tmp/cover_*.exit
            /tmp/cover-hostile.json
            /tmp/cover-hostile.log
            /tmp/cover-hostile.exit
            /tmp/hostile-cover-mutant-kernel.blob