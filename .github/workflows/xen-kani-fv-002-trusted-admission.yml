name: Trusted XEN-KANI-FV-002 Admission

on:
  workflow_run:
    workflows: ["XEN-KANI-FV-002 Replay Kernel"]
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/xen-kani-fv-002-trusted-admission.yml"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

env:
  BASE_SHA: 057dd03043b8863d8f8280abf333331cc9ddf317
  EXPECTED_HEAD_REPO: Luminous-Dynamics/xenia-wire
  EXPECTED_KERNEL_BLOB: d1bc8a1f8fc0883856d5073fa37b1658a7ea63ad
  EXPECTED_PROOF_BLOB: 4e3f0f584ca189baafe230da66b4bdeac87a7515
  EXPECTED_EVIDENCE_CONTRACT_BLOB: ce3e1447cc6b9bd1f0fc361b4fb81c5fe1450b0b
  EXPECTED_TRIGGER_WORKFLOW_ID: 373424313
  EXPECTED_TRIGGER_WORKFLOW_PATH: .github/workflows/xen-kani-fv-002-replay-kernel-v2.yml
  EXPECTED_TRIGGER_WORKFLOW_BLOB: 44ee053e9d60779b081986769e6ff69b0c262517
  VERIFIER_WORKFLOW_PATH: .github/workflows/xen-kani-fv-002-trusted-admission.yml
  EXPECTED_VERIFIER_WORKFLOW_ID: 373418900
  EXPECTED_TRIGGER_BRANCH: formal/xen-kani-fv-002-replay-kernel
  EXPECTED_QUALIFIED_HEAD_SHA: 1fbea431db9e7e20ae3b31e925219a90de2b36bd
  KANI_VERSION: 0.68.0
  EXPECTED_KANI_CBMC_VERSION: 6.11.0
  EXPECTED_KANI_RELEASE_TAG: kani-0.68.0
  EXPECTED_KANI_RELEASE_COMMIT_SHA: 0d2328a93f0e0ff66132d6bfa1a7d884877cf862
  EXPECTED_KANI_RUST_TOOLCHAIN: nightly-2026-08-21
  EXPECTED_KANI_RUST_COMMIT_HASH: 8925ea358a0f265ca61026aadc7ecc506c545cbe

jobs:
  non-authoritative-selftest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted workflow structure and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import re
          from pathlib import Path

          workflow=Path(".github/workflows/xen-kani-fv-002-trusted-admission.yml").read_text()
          required_steps=[
              "Checkout exact PR subject",
              "Verify trusted workflow structure and Python syntax",
              "Extract verifier-generated reachability source",
              "Verify self-test reachability source policy",
              "Fetch frozen replay kernel for self-test",
              "Build minimal self-test crate",
              "Install pinned Kani for self-test",
              "Execute all trusted cover witnesses as non-authoritative self-test",
              "Retain non-authoritative self-test evidence",
              "Prepare trusted verifier workspace",
              "Verify trusted verifier workflow identity",
              "Verify triggering workflow identity and provenance",
              "Verify triggering workflow source identity",
              "Verify triggering PR identity",
              "Fetch PR replay kernel as data",
              "Verify PR scope independently",
              "Verify complete tree delta independently",
              "Verify formal evidence contract independently",
              "Verify independent fetched source policy",
              "Verify independent harness manifest",
              "Verify minimal trusted crate is locked and dependency-free",
              "Install pinned Kani",
              "Run all trusted clean proofs",
              "Build trusted clean proof manifest",
              "Verify trusted reachability source shape",
              "Run trusted reachability covers",
              "Build trusted reachability manifest",
              "Run trusted hostile control",
              "Restore trusted clean source identity",
              "Run hostile reachability control",
              "Restore trusted clean source identity after reachability control",
              "Re-verify triggering PR freshness before receipt",
              "Retain trusted receipt",
              "Verify trusted evidence inventory",
              "Upload trusted evidence",
              "Verify trusted evidence upload identity",
              "Build authority terminal receipt",
              "Upload authority terminal",
              "Verify authority terminal upload identity",
          ]
          assert len(required_steps)==39, f"expected 39 required steps, got {len(required_steps)}"
          required_step_lines=["      - name: "+name for name in required_steps]
          observed_step_lines=[line for line in workflow.splitlines() if line.startswith("      - name: ")]
          for needle in required_step_lines:
              assert observed_step_lines.count(needle)==1, needle
          assert observed_step_lines == required_step_lines, (
              "trusted workflow step inventory/order mismatch"
          )

          assert workflow.count("  trusted-admission:\n")==1
          assert workflow.count("  non-authoritative-selftest:\n")==1
          assert workflow.count("  workflow_run:\n")==1
          assert workflow.count("  pull_request:\n")==1
          assert "permissions:\n  actions: read\n  contents: read\n  pull-requests: read" in workflow
          assert "cancel-in-progress: true" in workflow
          forbidden_surfaces = (
              "pull_"+"request_target",
              "issue_"+"comment:",
              "workflow_"+"dispatch:",
              "secret"+"s.",
          )
          for surface in forbidden_surfaces:
              assert surface not in workflow, f"forbidden workflow surface: {surface}"

          uses=re.findall(r"^\s+uses:\s+([^\s#]+)",workflow,re.MULTILINE)
          expected_uses=[
              "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
              "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
              "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
              "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          ]
          assert uses==expected_uses, f"unexpected action references: {uses}"
          assert all(re.fullmatch(r"[^@]+@[0-9a-f]{40}",x) for x in uses)

          lines=workflow.splitlines()
          run_lines=[line for line in lines if re.fullmatch(r" {8}run:.*",line)]
          assert len(run_lines)==35, f"expected 35 run steps, got {len(run_lines)}"
          assert all(line=="        run: |" for line in run_lines), "all executable blocks must use literal run: |"
          shell_lines=[line for line in lines if re.fullmatch(r" {8}shell:.*",line)]
          assert len(shell_lines)==35, f"expected 35 shell declarations, got {len(shell_lines)}"
          assert all(line=="        shell: bash" for line in shell_lines), "all executable steps must use shell: bash"
          run_blocks=[]
          for idx,line in enumerate(lines):
              if not re.fullmatch(r" {8}run: \|",line):
                  continue
              body=[]
              j=idx+1
              while j < len(lines):
                  candidate=lines[j]
                  if candidate and len(candidate)-len(candidate.lstrip(" ")) <= 8:
                      break
                  body.append(candidate)
                  j+=1
              run_blocks.append("\n".join(body))
          assert len(run_blocks)==35
          for block in run_blocks:
              github_expr="$"+"{{ github."
              assert github_expr not in block, (
                  "GitHub context interpolated directly into shell run block"
              )
          blocks=[]
          i=0
          while i < len(lines):
              if re.match(r"^\s*python3\b.*<<'PY'\s*$", lines[i]):
                  start=i+1
                  body=[]
                  i=start
                  while i < len(lines) and lines[i] != "          PY":
                      line=lines[i]
                      assert not line or line.startswith("          "), (
                          f"unexpected heredoc indentation at line {i+1}"
                      )
                      body.append(line[10:] if line else "")
                      i+=1
                  assert i < len(lines), f"unterminated Python heredoc at line {start}"
                  blocks.append("\n".join(body)+"\n")
              i+=1

          assert len(blocks) >= 10, f"unexpected Python heredoc count: {len(blocks)}"
          for index, block in enumerate(blocks, start=1):
              ast.parse(block, filename=f"workflow-python-heredoc-{index}.py")
          PY

          ruby <<'RUBY'
          require "yaml"

          workflow=YAML.safe_load(File.read(".github/workflows/xen-kani-fv-002-trusted-admission.yml"), aliases: false)
          abort "workflow root must be a mapping" unless workflow.is_a?(Hash)
          top_level_keys=workflow.keys.map { |key| key == true ? "on" : key.to_s }.sort
          abort "unexpected top-level workflow keys" unless top_level_keys == ["concurrency","env","jobs","name","on","permissions"]
          abort "workflow name mismatch" unless workflow["name"] == "Trusted XEN-KANI-FV-002 Admission"
          expected_env={
            "BASE_SHA"=>"057dd03043b8863d8f8280abf333331cc9ddf317",
            "EXPECTED_HEAD_REPO"=>"Luminous-Dynamics/xenia-wire",
            "EXPECTED_KERNEL_BLOB"=>"d1bc8a1f8fc0883856d5073fa37b1658a7ea63ad",
            "EXPECTED_PROOF_BLOB"=>"4e3f0f584ca189baafe230da66b4bdeac87a7515",
            "EXPECTED_EVIDENCE_CONTRACT_BLOB"=>"ce3e1447cc6b9bd1f0fc361b4fb81c5fe1450b0b",
            "EXPECTED_TRIGGER_WORKFLOW_ID"=>373424313,
            "EXPECTED_TRIGGER_WORKFLOW_PATH"=>".github/workflows/xen-kani-fv-002-replay-kernel-v2.yml",
            "EXPECTED_TRIGGER_WORKFLOW_BLOB"=>"44ee053e9d60779b081986769e6ff69b0c262517",
            "VERIFIER_WORKFLOW_PATH"=>".github/workflows/xen-kani-fv-002-trusted-admission.yml",
            "EXPECTED_VERIFIER_WORKFLOW_ID"=>373418900,
            "EXPECTED_TRIGGER_BRANCH"=>"formal/xen-kani-fv-002-replay-kernel",
            "EXPECTED_QUALIFIED_HEAD_SHA"=>"1fbea431db9e7e20ae3b31e925219a90de2b36bd",
            "KANI_VERSION"=>"0.68.0",
            "EXPECTED_KANI_CBMC_VERSION"=>"6.11.0",
            "EXPECTED_KANI_RELEASE_TAG"=>"kani-0.68.0",
            "EXPECTED_KANI_RELEASE_COMMIT_SHA"=>"0d2328a93f0e0ff66132d6bfa1a7d884877cf862",
            "EXPECTED_KANI_RUST_TOOLCHAIN"=>"nightly-2026-08-21",
            "EXPECTED_KANI_RUST_COMMIT_HASH"=>"8925ea358a0f265ca61026aadc7ecc506c545cbe",
          }
          parsed_env=workflow.fetch("env")
          abort "top-level env mismatch" unless parsed_env == expected_env
          expr_start="$"+"{{"
          abort "top-level env must contain no expressions" if parsed_env.values.any? { |value| value.is_a?(String) && value.include?(expr_start) }

          on_key=workflow.key?("on") ? "on" : true
          abort "missing workflow trigger map" unless workflow.key?(on_key)
          triggers=workflow.fetch(on_key)
          abort "unexpected trigger keys" unless triggers.is_a?(Hash) && triggers.keys.map(&:to_s).sort == ["pull_request","workflow_run"]

          workflow_run=triggers.fetch("workflow_run")
          abort "workflow_run trigger mismatch" unless workflow_run == {
            "workflows"=>["XEN-KANI-FV-002 Replay Kernel"],
            "types"=>["completed"],
          }
          pull_request=triggers.fetch("pull_request")
          abort "pull_request trigger mismatch" unless pull_request["types"] == ["opened","synchronize","reopened","ready_for_review"] &&
            pull_request["paths"] == [".github/workflows/xen-kani-fv-002-trusted-admission.yml"]

          jobs=workflow.fetch("jobs")
          abort "unexpected job set" unless jobs.is_a?(Hash) && jobs.keys.map(&:to_s).sort == ["non-authoritative-selftest","trusted-admission"]
          selftest=jobs.fetch("non-authoritative-selftest")
          abort "self-test trigger predicate mismatch" unless selftest["if"] == "github.event_name == 'pull_request'"
          abort "self-test runner mismatch" unless selftest["runs-on"] == "ubuntu-24.04" && selftest["timeout-minutes"] == 30
          abort "self-test permissions mismatch" unless selftest["permissions"] == {"contents"=>"read"}

          trusted=jobs.fetch("trusted-admission")
          expected_trusted_if="github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != null && github.event.workflow_run.head_branch == 'formal/xen-kani-fv-002-replay-kernel' && github.event.workflow_run.conclusion == 'success'"
          abort "trusted trigger predicate mismatch" unless trusted["if"] == expected_trusted_if
          abort "trusted runner mismatch" unless trusted["runs-on"] == "ubuntu-24.04" && trusted["timeout-minutes"] == 60
          abort "trusted job unexpectedly overrides permissions" if trusted.key?("permissions")
          expected_steps=[
            "Checkout exact PR subject",
            "Verify trusted workflow structure and Python syntax",
            "Extract verifier-generated reachability source",
            "Verify self-test reachability source policy",
            "Fetch frozen replay kernel for self-test",
            "Build minimal self-test crate",
            "Install pinned Kani for self-test",
            "Execute all trusted cover witnesses as non-authoritative self-test",
            "Retain non-authoritative self-test evidence",
            "Prepare trusted verifier workspace",
            "Verify trusted verifier workflow identity",
            "Verify triggering workflow identity and provenance",
            "Verify triggering workflow source identity",
            "Verify triggering PR identity",
            "Fetch PR replay kernel as data",
            "Verify PR scope independently",
            "Verify complete tree delta independently",
            "Verify formal evidence contract independently",
            "Verify independent fetched source policy",
            "Verify independent harness manifest",
            "Verify minimal trusted crate is locked and dependency-free",
            "Install pinned Kani",
            "Run all trusted clean proofs",
            "Build trusted clean proof manifest",
            "Verify trusted reachability source shape",
            "Run trusted reachability covers",
            "Build trusted reachability manifest",
            "Run trusted hostile control",
            "Restore trusted clean source identity",
            "Run hostile reachability control",
            "Restore trusted clean source identity after reachability control",
            "Re-verify triggering PR freshness before receipt",
            "Retain trusted receipt",
            "Verify trusted evidence inventory",
            "Upload trusted evidence",
            "Verify trusted evidence upload identity",
            "Build authority terminal receipt",
            "Upload authority terminal",
          ]
          expected_steps.each_with_index do |name, index|
            step=jobs.fetch("trusted-admission").fetch("steps").fetch(index)
            abort "missing or reordered trusted step #{index+1}: #{name}" unless step["name"] == name
          end
          abort "trusted step count mismatch" unless jobs.fetch("trusted-admission").fetch("steps").length == 38

          expected_uses=[
            "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
            "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
            "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
            "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          ]
          observed_uses=workflow.values.flat_map { |v|
            v.is_a?(Hash) ? v.values.flat_map { |j|
              j.is_a?(Hash) && j["steps"].is_a?(Array) ? j["steps"].filter_map { |s| s["uses"] } : []
            } : []
          }
          abort "action inventory mismatch" unless observed_uses == expected_uses

          jobs.each do |job_id, job|
            abort "job #{job_id} must use ubuntu-24.04" unless job["runs-on"] == "ubuntu-24.04"
            job.fetch("steps").each do |step|
              keys=step.keys.map(&:to_s)
              abort "step has both run and uses: #{step["name"]}" if step.key?("run") && step.key?("uses")
              if step.key?("run")
                abort "run step must use bash: #{step["name"]}" unless step["shell"] == "bash"
              elsif step.key?("uses")
                abort "unsupported action step: #{step["uses"]}" unless expected_uses.include?(step["uses"])
              else
                abort "step has neither run nor uses: #{step["name"]}"
              end
              abort "unexpected step key in #{step["name"]}: #{(keys - ["name","run","shell","uses","with","if","id","env","working-directory"]).inspect}"
            end
          end

          permissions=workflow.fetch("permissions")
          abort "workflow permissions are not read-only" unless permissions == {
            "actions"=>"read",
            "contents"=>"read",
            "pull-requests"=>"read",
          }

          concurrency=workflow.fetch("concurrency")
          expected_group="$"+"{{ github.workflow }}"+"-"+"{{ github.event_name }}"+"-"+"{{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}"
          abort "concurrency contract mismatch" unless concurrency["cancel-in-progress"] == true && concurrency["group"] == expected_group
          puts "YAML semantic workflow guard passed"
          RUBY

      - name: Extract verifier-generated reachability source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path(".github/workflows/xen-kani-fv-002-trusted-admission.yml").read_text()
          workflow_lines=workflow.splitlines()
          start="          cat > /tmp/xen-kani-trusted/src/replay_kernel_cover.rs <<'EOF'"
          marker="          EOF"
          try:
              start_line=workflow_lines.index(start)
          except ValueError:
              raise SystemExit("reachability source generator missing")
          try:
              end_line=workflow_lines.index(marker,start_line+1)
          except ValueError:
              raise SystemExit("reachability source generator terminator missing")
          block=workflow_lines[start_line+1:end_line]
          if not block:
              raise SystemExit("reachability source generator is empty")
          lines=[]
          for line in block:
              if line and not line.startswith("          "):
                  raise SystemExit("unexpected generator indentation")
              lines.append(line[10:] if line else "")
          out=Path("/tmp/replay_kernel_cover.rs")
          out.write_text("\n".join(lines)+"\n")
          PY
          test -s /tmp/replay_kernel_cover.rs
          grep -q 'kani::cover!(' /tmp/replay_kernel_cover.rs
          test "$(grep -c 'kani::cover!(' /tmp/replay_kernel_cover.rs)" -eq 6

      - name: Verify self-test reachability source policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          source=Path("/tmp/replay_kernel_cover.rs").read_text()
          forbidden=(
              "include!(",
              "include_bytes!(",
              "#[path",
              "std::process",
              "std::fs",
              "std::env",
              "std::net",
              "std::thread",
              "proc_macro",
          )
          lexical_escape=re.compile(
              r"\b(?:unsafe|extern)\b|(?:asm|global_asm|env|option_env)!\s*\("
          )
          for token in forbidden:
              assert token not in source, f"forbidden escape hatch in self-test source: {token}"
          assert lexical_escape.search(source) is None, (
              "forbidden language or environment escape hatch in self-test source"
          )
          assert source.count("#[kani::proof]")==6
          assert source.count("kani::cover!(")==6
          expected_functions={
              "cover_initialization_reachable",
              "cover_advance_shift_reachable",
              "cover_in_window_replay_mark_reachable",
              "cover_exact_window_boundary_reachable",
              "cover_stale_boundary_rejection_reachable",
              "cover_exact_window_jump_reset_reachable",
          }
          discovered=set(re.findall(r"^\s*fn\s+([A-Za-z0-9_]+)\s*\(",source,re.MULTILINE))
          assert discovered==expected_functions, f"unexpected self-test function set: {sorted(discovered)}"
          PY

      - name: Fetch frozen replay kernel for self-test
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github.raw+json"             "https://api.github.com/repos/$EXPECTED_HEAD_REPO/contents/src/replay_kernel.rs?ref=$EXPECTED_QUALIFIED_HEAD_SHA"             -o /tmp/selftest-replay_kernel.rs
          blob="$(git hash-object /tmp/selftest-replay_kernel.rs)"
          echo "$blob" > /tmp/selftest-replay-kernel.blob
          test "$blob" = "$EXPECTED_KERNEL_BLOB"

      - name: Build minimal self-test crate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xen-kani-selftest/src
          cp /tmp/selftest-replay_kernel.rs /tmp/xen-kani-selftest/src/replay_kernel.rs
          cp /tmp/replay_kernel_cover.rs /tmp/xen-kani-selftest/src/replay_kernel_cover.rs
          cat > /tmp/xen-kani-selftest/src/lib.rs <<'EOF'
          #![forbid(unsafe_code)]
          mod replay_kernel;
          #[cfg(kani)]
          mod replay_kernel_cover;
          EOF
          cat > /tmp/xen-kani-selftest/Cargo.toml <<'EOF'
          [package]
          name = "xen_kani_reachability_selftest"
          version = "0.1.0"
          edition = "2021"
          EOF
          cd /tmp/xen-kani-selftest
          cargo generate-lockfile --offline
          cargo metadata --locked --offline --no-deps --format-version 1 > /tmp/selftest-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/selftest-metadata.json").read_text())
          assert len(d["packages"])==1
          assert d["packages"][0]["name"]=="xen_kani_reachability_selftest"
          assert d["packages"][0].get("dependencies",[]) == []
          PY

      - name: Install pinned Kani for self-test
        shell: bash
        run: |
          set -euo pipefail
          # Tool acquisition intentionally uses the runner's network; all subject
          # generation, metadata, and subsequent verification runs remain offline.
          cargo install --locked kani-verifier --version "0.68.0"
          cargo kani setup
          cargo kani --version --verbose | tee /tmp/selftest-kani-version.txt
          grep -q "Kani Rust Verifier 0.68.0" /tmp/selftest-kani-version.txt
          grep -q "CBMC 6.11.0" /tmp/selftest-kani-version.txt
          rustup run "$EXPECTED_KANI_RUST_TOOLCHAIN" rustc -Vv | tee /tmp/selftest-kani-rustc.txt
          grep -q "commit-hash: $EXPECTED_KANI_RUST_COMMIT_HASH" /tmp/selftest-kani-rustc.txt

      - name: Execute all trusted cover witnesses as non-authoritative self-test
        working-directory: /tmp/xen-kani-selftest
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          cat > /tmp/selftest-covers.txt <<'EOF'
          cover_initialization_reachable
          cover_advance_shift_reachable
          cover_in_window_replay_mark_reachable
          cover_exact_window_boundary_reachable
          cover_stale_boundary_rejection_reachable
          cover_exact_window_jump_reset_reachable
          EOF
          while IFS= read -r harness; do
            set +e
            cargo kani -Z unstable-options --tests --default-unwind 20 \
              --harness "$harness" \
              --export-json "/tmp/selftest-$harness.json" \
              > "/tmp/selftest-$harness.log" 2>&1
            status=$?
            set -e
            cat "/tmp/selftest-$harness.log"
            test "$status" -eq 0
            python3 - "$harness" "/tmp/selftest-$harness.json" <<'PY'
          import json,sys,re
          from pathlib import Path
          harness=sys.argv[1]
          def normalize_description(value):
              return re.sub(r"\s+", " ", str(value)).strip()
          d=json.loads(Path(sys.argv[2]).read_text())
          expected_descriptions={
              "cover_initialization_reachable":"cover condition: accepted && state.initialized && state.highest == seq && state.bitmap[0] == 1",
              "cover_advance_shift_reachable":"cover condition: accepted && state.highest == 101 && state.bitmap[0] & 3 == 3",
              "cover_in_window_replay_mark_reachable":"cover condition: accepted && state.highest == 100 && state.bitmap[0] & 2 == 2",
              "cover_exact_window_boundary_reachable":"cover condition: accepted && state.highest == 100 && state.bitmap[0] & (1u64 << 63) != 0",
              "cover_stale_boundary_rejection_reachable":"cover condition: !accepted && state.highest == 100",
              "cover_exact_window_jump_reset_reachable":"cover condition: accepted && state.highest == 164 && state.bitmap[0] == 1 && state.bitmap[1] == 0",
          }
          vr=d.get("verification_results",{})
          rs=vr.get("results",[]) if isinstance(vr,dict) else []
          c=[x for x in rs if isinstance(x,dict) and (x.get("harness_id")==harness or str(x.get("harness_id","")).endswith("::"+harness))]
          assert len(c)==1
          checks=[x for x in c[0].get("checks",[]) if isinstance(x,dict) and (".cover." in str(x.get("name","")) or str(x.get("description","")).startswith("cover condition:"))]
          assert len(checks)==1
          assert str(checks[0].get("status","")).upper()=="SATISFIED"
          assert normalize_description(checks[0].get("description"))==normalize_description(expected_descriptions[harness])
          PY
          done < /tmp/selftest-covers.txt

      - name: Retain non-authoritative self-test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xen-kani-fv-002-reachability-selftest-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/replay_kernel_cover.rs
            /tmp/selftest-replay_kernel.rs
            /tmp/selftest-replay-kernel.blob
            /tmp/selftest-covers.txt
            /tmp/selftest-kani-version.txt
            /tmp/selftest-kani-rustc.txt
            /tmp/selftest-*.json
            /tmp/selftest-*.log
          if-no-files-found: error
          retention-days: 30

  trusted-admission:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != null && github.event.workflow_run.head_branch == 'formal/xen-kani-fv-002-replay-kernel' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Prepare trusted verifier workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xen-kani-trusted/src
          cat > /tmp/xen-kani-trusted/Cargo.toml <<'EOF'
          [package]
          name = "xen_kani_trusted_subject"
          version = "0.1.0"
          edition = "2021"
          EOF

      - name: Verify trusted verifier workflow identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$EXPECTED_HEAD_REPO/actions/runs/$GITHUB_RUN_ID" \
            -o /tmp/verifier-run.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          d=json.loads(Path("/tmp/verifier-run.json").read_text())
          assert d["id"]==int(os.environ["GITHUB_RUN_ID"])
          assert d["workflow_id"]==int(os.environ["EXPECTED_VERIFIER_WORKFLOW_ID"])
          assert d["name"]=="Trusted XEN-KANI-FV-002 Admission"
          assert d["path"]==os.environ["VERIFIER_WORKFLOW_PATH"]
          assert d["event"]=="workflow_run"
          assert d["head_branch"]=="main"
          assert d["head_sha"]==os.environ["GITHUB_SHA"]
          PY
          curl --fail-with-body --silent --show-error \\
            -H "Authorization: Bearer $GITHUB_TOKEN" \\
            -H "Accept: application/vnd.github.raw+json" \\
            "https://api.github.com/repos/$EXPECTED_HEAD_REPO/contents/$VERIFIER_WORKFLOW_PATH?ref=$GITHUB_SHA" \\
            -o /tmp/trusted-verifier-workflow.yml
          verifier_blob="$(git hash-object /tmp/trusted-verifier-workflow.yml)"
          printf '%s\\n' "$verifier_blob" > /tmp/verifier-workflow.blob
          printf 'verifier_commit=%s\\nverifier_workflow_blob=%s\\n' "$GITHUB_SHA" "$verifier_blob" | tee /tmp/verifier-workflow.txt
          test -s /tmp/trusted-verifier-workflow.yml

      - name: Verify triggering workflow identity and provenance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/Luminous-Dynamics/xenia-wire/actions/runs/$TRIGGER_RUN_ID"             -o /tmp/trigger-run.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path("/tmp/trigger-run.json").read_text())
          assert d["id"]==int(os.environ["TRIGGER_RUN_ID"])
          assert d["run_attempt"]==int(os.environ["TRIGGER_RUN_ATTEMPT"])
          assert d["name"]=="XEN-KANI-FV-002 Replay Kernel"
          assert d["path"]==os.environ["EXPECTED_TRIGGER_WORKFLOW_PATH"]
          assert d["workflow_id"]==int(os.environ["EXPECTED_TRIGGER_WORKFLOW_ID"])
          assert d["head_branch"]==os.environ["EXPECTED_TRIGGER_BRANCH"]
          assert d["event"]=="pull_request"
          assert d["head_sha"]==os.environ["HEAD_SHA"]
          assert d["head_repository"]["full_name"]==os.environ["HEAD_REPO"]
          assert os.environ["HEAD_REPO"]==os.environ["EXPECTED_HEAD_REPO"]
          pull_requests=d.get("pull_requests",[])
          assert len(pull_requests)==1, f"unexpected triggering PR cardinality: {len(pull_requests)}"
          assert pull_requests[0]["number"]==int(os.environ["PR_NUMBER"])
          assert d["conclusion"]==os.environ["TRIGGER_CONCLUSION"]
          PY

      - name: Verify triggering workflow source identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \\
            -H "Authorization: Bearer $GITHUB_TOKEN" \\
            -H "Accept: application/vnd.github.raw+json" \\
            "https://api.github.com/repos/$HEAD_REPO/contents/$EXPECTED_TRIGGER_WORKFLOW_PATH?ref=$HEAD_SHA" \\
            -o /tmp/trigger-workflow.yml
          trigger_blob="$(git hash-object /tmp/trigger-workflow.yml)"
          printf '%s\\n' "$trigger_blob" > /tmp/trigger-workflow.blob
          test "$trigger_blob" = "$EXPECTED_TRIGGER_WORKFLOW_BLOB"
          printf 'trigger_workflow_blob=%s\\n' "$trigger_blob" | tee /tmp/trigger-workflow.txt

      - name: Verify triggering PR identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/Luminous-Dynamics/xenia-wire/pulls/$PR_NUMBER"             -o /tmp/pr.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path("/tmp/pr.json").read_text())
          assert d["number"]==int(os.environ["PR_NUMBER"])
          assert d["state"]=="open"
          assert d["merged"] is False
          assert d["base"]["ref"]=="main"
          assert d["base"]["repo"]["full_name"]==os.environ["EXPECTED_HEAD_REPO"]
          assert d["head"]["ref"]==os.environ["HEAD_BRANCH"]
          assert d["head"]["sha"]==os.environ["HEAD_SHA"]
          assert d["head"]["repo"]["full_name"]==os.environ["EXPECTED_HEAD_REPO"]
          assert d["head"]["repo"]["full_name"]==os.environ["HEAD_REPO"]
          PY

      - name: Fetch PR replay kernel as data
        id: fetch-subject
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github.raw+json"             "https://api.github.com/repos/$HEAD_REPO/contents/src/replay_kernel.rs?ref=$HEAD_SHA"             -o /tmp/xen-kani-trusted/src/replay_kernel.rs
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github.raw+json"             "https://api.github.com/repos/$HEAD_REPO/contents/src/replay_kernel_kani.rs?ref=$HEAD_SHA"             -o /tmp/xen-kani-trusted/src/replay_kernel_kani.rs
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github.raw+json"             "https://api.github.com/repos/$HEAD_REPO/contents/docs/formal/xen-kani-fv-002-replay-kernel-v1.json?ref=$HEAD_SHA"             -o /tmp/xen-kani-trusted/evidence.json

          cat > /tmp/xen-kani-trusted/src/lib.rs <<'EOF'
          #![forbid(unsafe_code)]
          mod replay_kernel;
          #[cfg(kani)]
          #[path = "replay_kernel_kani.rs"]
          mod replay_kernel_kani;
          #[cfg(kani)]
          #[path = "replay_kernel_cover.rs"]
          mod replay_kernel_cover;
          EOF

          cat > /tmp/xen-kani-trusted/src/replay_kernel_cover.rs <<'EOF'
          //! Trusted reachability witnesses for the frozen replay transition kernel.
          //!
          //! This source is generated by the trusted verifier workflow rather than
          //! fetched from the pull request. It contains reachability-only cover
          //! checks and does not add a production safety claim.
          use crate::replay_kernel::{ReplayState, transition};

          #[kani::proof]
          #[kani::unwind(20)]
          fn cover_initialization_reachable() {
              let mut state = ReplayState::new();
              let seq: u64 = kani::any();
              let accepted = transition(&mut state, 64, seq);
              kani::cover!(accepted && state.initialized && state.highest == seq && state.bitmap[0] == 1);
          }

          #[kani::proof]
          #[kani::unwind(20)]
          fn cover_advance_shift_reachable() {
              let mut state = ReplayState::new();
              transition(&mut state, 64, 100);
              let accepted = transition(&mut state, 64, 101);
              kani::cover!(accepted && state.highest == 101 && state.bitmap[0] & 3 == 3);
          }

          #[kani::proof]
          #[kani::unwind(20)]
          fn cover_in_window_replay_mark_reachable() {
              let mut state = ReplayState::new();
              transition(&mut state, 64, 100);
              let accepted = transition(&mut state, 64, 99);
              kani::cover!(accepted && state.highest == 100 && state.bitmap[0] & 2 == 2);
          }

          #[kani::proof]
          #[kani::unwind(20)]
          fn cover_exact_window_boundary_reachable() {
              let mut state = ReplayState::new();
              transition(&mut state, 64, 100);
              let accepted = transition(&mut state, 64, 37);
              kani::cover!(accepted && state.highest == 100 && state.bitmap[0] & (1u64 << 63) != 0);
          }

          #[kani::proof]
          #[kani::unwind(20)]
          fn cover_stale_boundary_rejection_reachable() {
              let mut state = ReplayState::new();
              transition(&mut state, 64, 100);
              let accepted = transition(&mut state, 64, 36);
              kani::cover!(!accepted && state.highest == 100);
          }

          #[kani::proof]
          #[kani::unwind(20)]
          fn cover_exact_window_jump_reset_reachable() {
              let mut state = ReplayState::new();
              transition(&mut state, 64, 100);
              let accepted = transition(&mut state, 64, 164);
              kani::cover!(
                  accepted
                      && state.highest == 164
                      && state.bitmap[0] == 1
                      && state.bitmap[1] == 0
              );
          }
          EOF
          cat > /tmp/cover-harnesses.txt <<'EOF'
          cover_initialization_reachable
          cover_advance_shift_reachable
          cover_in_window_replay_mark_reachable
          cover_exact_window_boundary_reachable
          cover_stale_boundary_rejection_reachable
          cover_exact_window_jump_reset_reachable
          EOF
          cargo generate-lockfile --offline
          test -s /tmp/xen-kani-trusted/Cargo.lock
          printf '%s\n' "$HEAD_SHA" > /tmp/xen-kani-trusted/head.sha
          printf '%s\n' "$PR_NUMBER" > /tmp/xen-kani-trusted/pr.number

          blob_sha="$(git hash-object /tmp/xen-kani-trusted/src/replay_kernel.rs)"
          proof_blob_sha="$(git hash-object /tmp/xen-kani-trusted/src/replay_kernel_kani.rs)"
          evidence_blob_sha="$(git hash-object /tmp/xen-kani-trusted/evidence.json)"
          printf '%s\n' "$blob_sha" > /tmp/xen-kani-trusted/kernel.blob
          printf '%s\n' "$proof_blob_sha" > /tmp/xen-kani-trusted/proof.blob
          printf '%s\n' "$evidence_blob_sha" > /tmp/xen-kani-trusted/evidence.blob
          printf 'head=%s\nrepo=%s\nblob=%s\n' "$HEAD_SHA" "$HEAD_REPO" "$blob_sha" | tee /tmp/trusted-subject.txt

          test -s /tmp/xen-kani-trusted/src/replay_kernel.rs
          test "$(wc -c < /tmp/xen-kani-trusted/src/replay_kernel.rs)" -gt 1000
          test "$blob_sha" = "$EXPECTED_KERNEL_BLOB"
          test "$proof_blob_sha" = "$EXPECTED_PROOF_BLOB"
          test "$evidence_blob_sha" = "$EXPECTED_EVIDENCE_CONTRACT_BLOB"

      - name: Verify PR scope independently
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/Luminous-Dynamics/xenia-wire/compare/$BASE_SHA...$HEAD_SHA"             -o /tmp/compare.json

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          d=json.loads(Path("/tmp/compare.json").read_text())
          expected={
              ".github/workflows/xen-kani-fv-002-replay-kernel-v2.yml",
              "Cargo.toml",
              "docs/formal/xen-kani-fv-002-replay-kernel-v1.json",
              "src/lib.rs",
              "src/replay_kernel.rs",
              "src/replay_kernel_kani.rs",
              "src/replay_window.rs",
          }
          observed={x["filename"] for x in d.get("files",[])}
          assert d["status"]=="ahead"
          assert d["base_commit"]["sha"]=="057dd03043b8863d8f8280abf333331cc9ddf317"
          assert d["merge_base_commit"]["sha"]==os.environ["BASE_SHA"], (
              f"trusted lineage mismatch: {d.get('merge_base_commit',{}).get('sha')}"
          )
          assert observed==expected, f"trusted scope mismatch: {sorted(observed)}"
          PY

      - name: Verify complete tree delta independently
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Luminous-Dynamics/xenia-wire/commits/$BASE_SHA" \
            -o /tmp/base-commit.json

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$HEAD_REPO/commits/$HEAD_SHA" \
            -o /tmp/head-commit.json

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          base=json.loads(Path("/tmp/base-commit.json").read_text())
          head=json.loads(Path("/tmp/head-commit.json").read_text())
          assert base["sha"]==os.environ["BASE_SHA"]
          assert head["sha"]==os.environ["HEAD_SHA"]
          Path("/tmp/base-tree-sha").write_text(base["commit"]["tree"]["sha"]+"\n")
          Path("/tmp/head-tree-sha").write_text(head["commit"]["tree"]["sha"]+"\n")
          PY

          BASE_TREE="$(cat /tmp/base-tree-sha)"
          HEAD_TREE="$(cat /tmp/head-tree-sha)"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Luminous-Dynamics/xenia-wire/git/trees/$BASE_TREE?recursive=1" \
            -o /tmp/base-tree.json

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$HEAD_REPO/git/trees/$HEAD_TREE?recursive=1" \
            -o /tmp/head-tree.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          base=json.loads(Path("/tmp/base-tree.json").read_text())
          head=json.loads(Path("/tmp/head-tree.json").read_text())

          assert base.get("truncated") is False, "base tree response truncated"
          assert head.get("truncated") is False, "head tree response truncated"

          def index(doc):
              return {
                  item["path"]:(item.get("mode"),item.get("type"),item.get("sha"))
                  for item in doc["tree"]
              }

          b=index(base)
          h=index(head)
          changed=sorted(path for path in set(b)|set(h) if b.get(path)!=h.get(path))
          expected=sorted({
              ".github/workflows/xen-kani-fv-002-replay-kernel-v2.yml",
              "Cargo.toml",
              "docs/formal/xen-kani-fv-002-replay-kernel-v1.json",
              "src/lib.rs",
              "src/replay_kernel.rs",
              "src/replay_kernel_kani.rs",
              "src/replay_window.rs",
          })
          assert changed==expected, f"complete tree delta mismatch: {changed}"
          for path in expected:
              assert h[path][1]=="blob", f"head path is not a blob: {path}"
          Path("/tmp/trusted-tree-delta.txt").write_text(
              "base_tree="+Path("/tmp/base-tree-sha").read_text().strip()+"\n"
              "head_tree="+Path("/tmp/head-tree-sha").read_text().strip()+"\n"
              "changed="+",".join(changed)+"\n"
          )
          PY

      - name: Verify formal evidence contract independently
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          c=json.loads(Path("/tmp/xen-kani-trusted/evidence.json").read_text())
          assert c["schema"]=="xenia.formal.kani-replay-kernel.v1"
          assert c["tracking_issue"]==84
          assert c["authority"]=="EvidenceOnly"
          assert c["evidence_class"]=="BoundedModelSafety"
          assert c["parent"]["commit"]=="057dd03043b8863d8f8280abf333331cc9ddf317"
          assert c["subjects"]["production_kernel"]["blob"]=="d1bc8a1f8fc0883856d5073fa37b1658a7ea63ad"
          assert c["subjects"]["production_router"]["blob"]=="9c0760698520ed4213d14240f0077c35f3e4159a"
          assert c["subjects"]["proof_harness_source"]["blob"]=="4e3f0f584ca189baafe230da66b4bdeac87a7515"
          assert c["subjects"]["existing_fuzz_subject"]["blob"]=="a27128c0c503780ad9e12fda23ee907c8cd6aa1e"
          assert c["claim_ceiling"]=="ReplayWindowTransitionKernelBoundedModelSafetyWithinRecordedHarnessDomain"
          assert "unbounded replay-security theorem" in c["nonclaims"]
          assert "AEAD cryptographic security" in c["nonclaims"]
          assert "nonce uniqueness" in c["nonclaims"]
          assert "session or key-management correctness" in c["nonclaims"]
          assert "compiler or native-binary correctness" in c["nonclaims"]
          assert "runtime authorization" in c["nonclaims"]
          assert c["trusted_admission"]["pull_request"]==93
          assert c["trusted_admission"]["workflow"]==".github/workflows/xen-kani-fv-002-trusted-admission.yml"
          assert c["trusted_admission"]["authority_transfers_only_after_main_merge"] is True
          PY
      - name: Verify independent fetched source policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          kernel=Path("/tmp/xen-kani-trusted/src/replay_kernel.rs").read_text()
          proof=Path("/tmp/xen-kani-trusted/src/replay_kernel_kani.rs").read_text()

          forbidden=(
              "include!(",
              "include_bytes!(",
              "std::process",
              "std::fs",
              "std::env",
              "std::net",
              "std::thread",
              "proc_macro",
          )
          lexical_escape=re.compile(r"\b(?:unsafe|extern)\b|(?:asm|global_asm|env|option_env)!\s*\(")

          for name, source in (("replay_kernel.rs", kernel), ("replay_kernel_kani.rs", proof)):
              for token in forbidden:
                  assert token not in source, f"forbidden escape hatch in {name}: {token}"
              assert lexical_escape.search(source) is None, f"forbidden language escape hatch in {name}"

          assert not Path("/tmp/xen-kani-trusted/build.rs").exists()
          assert not Path("/tmp/xen-kani-trusted/.cargo/config.toml").exists()
          PY
      - name: Verify independent harness manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          source=Path("/tmp/xen-kani-trusted/src/replay_kernel_kani.rs").read_text()
          expected={
              "kernel_duplicate_rejected",
              "kernel_first_sequence_initializes_exactly",
              "kernel_stale_boundary_is_rejected",
              "kernel_higher_sequence_is_monotonic",
              "kernel_cross_word_shift_preserves_in_window_history",
              "kernel_exact_word_shift_preserves_in_window_history",
              "kernel_max_width_multiword_shift_preserves_history",
              "kernel_exact_window_jump_resets_history",
              "kernel_max_width_near_window_shift_preserves_history_boundary",
              "kernel_symbolic_shift_preserves_or_discards_history_exactly",
              "kernel_supported_widths_do_not_panic",
              "kernel_supported_width_boundary_is_exact",
              "kernel_bitmap_tail_is_zero_for_supported_widths",
              "kernel_u64_max_advance_preserves_previous_sequence",
          }
          lines=source.splitlines()
          discovered=set()
          for i, line in enumerate(lines):
              if line.strip()!="#[kani::proof]":
                  continue
              window=lines[i+1:i+6]
              for candidate in window:
                  match=re.match(r'^\s*fn\s+([A-Za-z0-9_]+)\s*\(', candidate)
                  if match:
                      discovered.add(match.group(1))
                      break
          assert discovered==expected, f"harness manifest mismatch: discovered={sorted(discovered)}"
          assert source.count("#[kani::proof]")==14
          for forbidden in (
              "include!(",
              "include_bytes!(",
              'extern "',
              "std::process",
              "std::fs",
              "std::env",
              "std::net",
              "std::thread",
              "proc_macro",
              "unsafe",
          ):
              assert forbidden not in source, f"forbidden escape hatch present: {forbidden}"
          assert source.count("#[kani::proof]")==14
          assert not source.rstrip().endswith("#[kani::proof]")
          PY

