name: Trusted XEN-KANI-FV-002 Admission

on:
  workflow_run:
    workflows: ["XEN-KANI-FV-002 Replay Kernel"]
    types: [completed]
    branches: ["formal/xen-kani-fv-002-replay-kernel"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/xen-kani-fv-002-trusted-admission.yml"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

env:
  BASE_SHA: 057dd03043b8863d8f8280abf333331cc9ddf317
  EXPECTED_HEAD_REPO: Luminous-Dynamics/xenia-wire
  EXPECTED_HEAD_REPO_ID: 1213976974
  EXPECTED_KERNEL_BLOB: d1bc8a1f8fc0883856d5073fa37b1658a7ea63ad
  EXPECTED_PROOF_BLOB: 4e3f0f584ca189baafe230da66b4bdeac87a7515
  EXPECTED_EVIDENCE_CONTRACT_BLOB: ce3e1447cc6b9bd1f0fc361b4fb81c5fe1450b0b
  EXPECTED_TRIGGER_WORKFLOW_ID: 373424313
  EXPECTED_TRIGGER_WORKFLOW_PATH: .github/workflows/xen-kani-fv-002-replay-kernel-v2.yml
  EXPECTED_TRIGGER_WORKFLOW_BLOB: 44ee053e9d60779b081986769e6ff69b0c262517
  VERIFIER_WORKFLOW_PATH: .github/workflows/xen-kani-fv-002-trusted-admission.yml
  EXPECTED_VERIFIER_WORKFLOW_ID: 373418900
  EXPECTED_TRIGGER_BRANCH: formal/xen-kani-fv-002-replay-kernel
  EXPECTED_QUALIFIED_HEAD_SHA: 1fbea431db9e7e20ae3b31e925219a90de2b36bd
  KANI_VERSION: 0.68.0
  EXPECTED_KANI_CBMC_VERSION: 6.11.0
  EXPECTED_KANI_RELEASE_TAG: kani-0.68.0
  EXPECTED_KANI_RELEASE_COMMIT_SHA: 0d2328a93f0e0ff66132d6bfa1a7d884877cf862
  EXPECTED_KANI_RELEASE_ASSET_ID: 566906903
  EXPECTED_KANI_RELEASE_ASSET_NAME: kani-0.68.0-x86_64-unknown-linux-gnu.tar.gz
  EXPECTED_KANI_RELEASE_ASSET_DIGEST: sha256:32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3
  EXPECTED_KANI_CRATE_SHA256: 842fabd2ba8b13babab862e21fef2946b581d493f23062d5ce86266630f1d1ae
  EXPECTED_KANI_RUST_TOOLCHAIN: nightly-2026-08-21
  EXPECTED_KANI_RUST_COMMIT_HASH: 8925ea358a0f265ca61026aadc7ecc506c545cbe

jobs:
  non-authoritative-selftest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted workflow structure and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import re
          import textwrap
          from pathlib import Path

          workflow=Path(".github/workflows/xen-kani-fv-002-trusted-admission.yml").read_text()
          required_steps=[
              "Checkout exact PR subject",
              "Verify trusted workflow structure and Python syntax",
              "Extract verifier-generated reachability source",
              "Verify self-test reachability source policy",
              "Fetch frozen replay kernel for self-test",
              "Build minimal self-test crate",
              "Install pinned Kani for self-test",
              "Execute all trusted cover witnesses as non-authoritative self-test",
              "Retain non-authoritative self-test evidence",
              "Prepare trusted verifier workspace",
              "Verify trusted event envelope",
              "Verify trusted verifier workflow identity",
              "Verify triggering workflow identity and provenance",
              "Verify triggering workflow source identity",
              "Verify triggering PR identity",
              "Reject trusted-verifier self-modification",
              "Fetch PR replay kernel as data",
              "Verify PR scope independently",
              "Verify complete tree delta independently",
              "Verify formal evidence contract independently",
              "Verify independent fetched source policy",
              "Verify independent harness manifest",
              "Verify minimal trusted crate is locked and dependency-free",
              "Install pinned Kani",
              "Run all trusted clean proofs",
              "Build trusted clean proof manifest",
              "Verify trusted reachability source shape",
              "Run trusted reachability covers",
              "Build trusted reachability manifest",
              "Run trusted hostile control",
              "Restore trusted clean source identity",
              "Run hostile reachability control",
              "Restore trusted clean source identity after reachability control",
              "Re-verify triggering PR freshness before receipt",
              "Retain trusted receipt",
              "Verify trusted evidence inventory",
              "Upload trusted evidence",
              "Verify trusted evidence upload identity",
              "Build authority terminal receipt",
              "Upload authority terminal",
              "Verify authority terminal upload identity",
          ]
          assert len(required_steps)==41, f"expected 41 required steps, got {len(required_steps)}"
          required_step_lines=["      - name: "+name for name in required_steps]
          observed_step_lines=[line for line in workflow.splitlines() if line.startswith("      - name: ")]
          for needle in required_step_lines:
              assert observed_step_lines.count(needle)==1, needle
          assert observed_step_lines == required_step_lines, (
              "trusted workflow step inventory/order mismatch"
          )

          assert workflow.count("  trusted-admission:\n")==1
          assert workflow.count("  non-authoritative-selftest:\n")==1
          assert workflow.count("  workflow_run:\n")==1
          assert workflow.count("  pull_request:\n")==1
          assert "permissions:\n  actions: read\n  contents: read\n  pull-requests: read" in workflow
          assert "cancel-in-progress: true" in workflow
          for required_literal in (
              'test "$GITHUB_EVENT_NAME" = "workflow_run"',
              'test -f "$GITHUB_EVENT_PATH"',
              'test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$VERIFIER_WORKFLOW_PATH@refs/heads/main"',
              'test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"',
              'assert event["action"]=="completed"',
              'assert event["repository"]["full_name"]==os.environ["EXPECTED_HEAD_REPO"]',
              'assert event["repository"]["id"]==int(os.environ["EXPECTED_HEAD_REPO_ID"])',
              'assert run["repository"]["id"]==int(os.environ["EXPECTED_HEAD_REPO_ID"])',
              'assert pull_requests[0]["base"]["repo"]["id"]==int(os.environ["EXPECTED_HEAD_REPO_ID"])',
              'assert pull_requests[0]["head"]["repo"]["id"]==int(os.environ["EXPECTED_HEAD_REPO_ID"])',
              'assert run["id"]==int(os.environ["TRIGGER_RUN_ID"])',
              'assert run["name"]=="XEN-KANI-FV-002 Replay Kernel"',
              'assert run["path"]==os.environ["EXPECTED_TRIGGER_WORKFLOW_PATH"]',
              'assert run["workflow_id"]==int(os.environ["EXPECTED_TRIGGER_WORKFLOW_ID"])',
              'assert run["event"]=="pull_request"',
              'assert run["conclusion"]=="success"',
              'test "$HEAD_SHA" = "$EXPECTED_QUALIFIED_HEAD_SHA"',
              'assert run["head_sha"]==os.environ["HEAD_SHA"]',
              'assert run["head_sha"]==os.environ["EXPECTED_QUALIFIED_HEAD_SHA"]',
              'assert run["head_commit"]["id"]==os.environ["HEAD_SHA"]',
              'assert d["head_sha"]==os.environ["HEAD_SHA"]',
              'assert d["head_sha"]==os.environ["EXPECTED_QUALIFIED_HEAD_SHA"]',
              'assert verification["verified"] is True',
              'Kani release commit signature verified by GitHub',
              'EXPECTED_KANI_RELEASE_ASSET_ID',
              'EXPECTED_KANI_RELEASE_ASSET_NAME',
              'EXPECTED_KANI_RELEASE_ASSET_DIGEST',
              'assert digest==os.environ["EXPECTED_KANI_RELEASE_ASSET_DIGEST"]',
              'EXPECTED_KANI_CRATE_SHA256',
              'self-test checkout credential persistence enabled',
              'artifact overwrite must remain disabled',
              'artifact hidden-file inclusion must remain disabled',
              'self-test checkout fetch-depth mismatch',
              'self-test checkout ref mismatch',
              'assert checksum==os.environ["EXPECTED_KANI_CRATE_SHA256"]',
              'https://api.github.com/repos/model-checking/kani/releases/tags/$EXPECTED_KANI_RELEASE_TAG',
              'cargo kani setup --use-local-bundle ' + '/tmp/kani-release-bundle.tar.gz',
              'x86_64-unknown-linux-gnu.tar.gz',
              'asset.get("digest")',
              'expected_path="/model-checking/kani/releases/download/"',
              'assert pull_requests[0]["base"]["ref"]=="main"',
              'assert pull_requests[0]["base"]["repo"]["full_name"]==os.environ["EXPECTED_HEAD_REPO"]',
              '"pre_transport_authority_eligible":pre_transport_authority_eligible',
              '"authority_eligible":False',
              'assert receipt["pre_transport_authority_eligible"] is True',
              'assert receipt["authority_eligible"] is False',
              '"terminal_pr_freshness_verified":True',
              'assert terminal["terminal_pr_freshness_verified"] is True',
              'terminal["authority_eligible"]=True',
              'assert main_branch["name"] == "main"',
              'assert main_branch["protected"] is True',
              'assert os.environ["GITHUB_REF_PROTECTED"] == "true"',
              'assert main_branch["commit"]["commit"]["verification"]["verified"] is True',
              'assert main_branch["commit"]["commit"]["verification"]["reason"] == "valid"',
              'assert main_branch["commit"]["sha"] == os.environ["GITHUB_SHA"]',
              'main_branch_protection_verified',
              'assert final_main_branch["name"] == "main"',
              'assert final_main_branch["protected"] is True',
              'assert final_main_branch["commit"]["commit"]["verification"]["verified"] is True',
              'assert final_main_branch["commit"]["commit"]["verification"]["reason"] == "valid"',
              'assert final_main_branch["commit"]["sha"] == os.environ["GITHUB_SHA"]',
              'final_main_branch_protection_verified',
              'assert terminal_main_branch["name"] == "main"',
              'assert terminal_main_branch["protected"] is True',
              'assert terminal_main_branch["commit"]["commit"]["verification"]["verified"] is True',
              'assert terminal_main_branch["commit"]["commit"]["verification"]["reason"] == "valid"',
              'assert terminal_main_branch["commit"]["sha"] == os.environ["GITHUB_SHA"]',
              'terminal_main_branch_protection_verified',
              'assert terminal["terminal_main_branch_protection_verified"] is True',
              'terminal["terminal_main_branch_protection_sha256"]',
              'terminal["terminal_main_branch_signed_tip_verified"] is True',
              'terminal_commit_signature_verified',
              'authority terminal must retain terminal main branch evidence',
              'assert concurrency["group"] == expected_group',
          ):
              assert required_literal in workflow, f"missing event envelope guard: {required_literal}"
          forbidden_surfaces = (
              "pull_"+"request_target",
              "issue_"+"comment:",
              "workflow_"+"dispatch:",
              "secret"+"s.",
          )
          for surface in forbidden_surfaces:
              assert surface not in workflow, f"forbidden workflow surface: {surface}"

          uses=re.findall(r"^\s+uses:\s+([^\s#]+)",workflow,re.MULTILINE)
          expected_uses=[
              "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
              "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
              "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
              "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          ]
          assert uses==expected_uses, f"unexpected action references: {uses}"
          assert all(re.fullmatch(r"[^@]+@[0-9a-f]{40}",x) for x in uses)

          lines=workflow.splitlines()
          run_lines=[line for line in lines if re.fullmatch(r" {8}run:.*",line)]
          assert len(run_lines)==36, f"expected 36 run steps, got {len(run_lines)}"
          assert all(line=="        run: |" for line in run_lines), "all executable blocks must use literal run: |"
          shell_lines=[line for line in lines if re.fullmatch(r" {8}shell:.*",line)]
          assert len(shell_lines)==36, f"expected 36 shell declarations, got {len(shell_lines)}"
          invalid_shell_lines=[repr(line) for line in shell_lines if line!="        shell: bash"]
          assert not invalid_shell_lines, f"all executable steps must use shell: bash; invalid={invalid_shell_lines!r}"
          run_blocks=[]
          for idx,line in enumerate(lines):
              if not re.fullmatch(r" {8}run: \|",line):
                  continue
              body=[]
              j=idx+1
              while j < len(lines):
                  candidate=lines[j]
                  if candidate and len(candidate)-len(candidate.lstrip(" ")) <= 8:
                      break
                  body.append(candidate)
                  j+=1
              run_blocks.append("\n".join(body))
          assert len(run_blocks)==36
          set_plus_blocks=[]
          set_fail_open="set "+"+e"
          set_fail_closed="set "+"-e"
          for index, block in enumerate(run_blocks, start=1):
              nonempty=[line.strip() for line in block.splitlines() if line.strip()]
              assert nonempty and nonempty[0]=="set -euo pipefail", f"run block {index} must start fail-closed"
              set_events=[line.strip() for line in block.splitlines() if line.strip() in {set_fail_open,set_fail_closed}]
              if set_fail_open in block:
                  assert set_events==[set_fail_open,set_fail_closed], f"unbalanced temporary fail-open mode in run block {index}"
                  set_plus_blocks.append(index)
              else:
                  assert set_events==[], f"unexpected shell mode change in run block {index}"
          assert set_plus_blocks==[7,22,25,27,29]
          verifier_install="cargo install --locked --path "+" /tmp/kani-verifier-0.68.0".lstrip()
          assert sum(verifier_install in block for block in run_blocks)==2
          forbidden_verifier_install="cargo install --locked "+"kani-verifier --version"
          assert sum(forbidden_verifier_install in block for block in run_blocks)==0
          kani_setup="cargo kani setup --use-local-bundle "+" /tmp/kani-release-bundle.tar.gz".lstrip()
          assert sum(kani_setup in block for block in run_blocks)==2
          from collections import Counter
          expr_start="$"+"{{"
          expr_end="}}"
          expression_pattern=re.escape(expr_start)+r"[^}]+\}\}"
          all_expression_counts=Counter(re.findall(expression_pattern,workflow))
          run_expression_counts=Counter(
              expression
              for block in run_blocks
              for expression in re.findall(expression_pattern,block)
          )
          expressions=all_expression_counts-run_expression_counts
          def expr(value):
              return expr_start+" "+value+" "+expr_end
          expected_expression_counts={
              expr("github.workflow"):1,
              expr("github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id"):1,
              expr("github.event.pull_request.head.sha"):2,
              expr("github.token"):14,
              expr("github.event.workflow_run.pull_requests[0].number"):5,
              expr("github.event.workflow_run.head_sha"):5,
              expr("github.event.workflow_run.head_repository.full_name"):1,
              expr("github.event.workflow_run.head_branch"):1,
              expr("github.event.workflow_run.id"):1,
              expr("github.event.workflow_run.run_attempt"):1,
              expr("github.event.workflow_run.conclusion"):1,
              expr("github.run_attempt"):5,
              expr("github.run_id"):2,
              expr("steps.trusted-evidence-upload.outputs.artifact-id"):2,
              expr("steps.trusted-evidence-upload.outputs.artifact-digest"):2,
              expr("steps.authority-terminal-upload.outputs.artifact-id"):1,
              expr("steps.authority-terminal-upload.outputs.artifact-digest"):1,
          }
          assert expressions==Counter(expected_expression_counts)
          for block in run_blocks:
              github_expr="$"+"{{ github."
              assert github_expr not in block, (
                  "GitHub context interpolated directly into shell run block"
              )
          blocks=[]
          i=0
          while i < len(lines):
              if re.match(r"^\s*python3\b.*<<'PY'\s*$", lines[i]):
                  start=i+1
                  body=[]
                  i=start
                  while i < len(lines) and lines[i] != "          PY":
                      line=lines[i]
                      assert not line or line.startswith("          "), (
                          f"unexpected heredoc indentation at line {i+1}"
                      )
                      body.append(line[10:] if line else "")
                      i+=1
                  assert i < len(lines), f"unterminated Python heredoc at line {start}"
                  blocks.append("\n".join(body)+"\n")
              i+=1

          assert len(blocks) >= 10, f"unexpected Python heredoc count: {len(blocks)}"
          for index, block in enumerate(blocks, start=1):
              tree=ast.parse(block, filename=f"workflow-python-heredoc-{index}.py")
              imported_names=set()
              for node in tree.body:
                  if isinstance(node, ast.Import):
                      imported_names.update(
                          alias.asname or alias.name.split(".")[0]
                          for alias in node.names
                      )
                  elif isinstance(node, ast.ImportFrom):
                      imported_names.update(
                          alias.asname or alias.name
                          for alias in node.names
                          if alias.name!="*"
                      )
              checked_names={"ast","hashlib","json","os","Path","PurePosixPath","re","shutil","subprocess","sys","tarfile","textwrap","urllib"}
              referenced_names={
                  node.id
                  for node in ast.walk(tree)
                  if isinstance(node, ast.Name)
                  and isinstance(node.ctx, ast.Load)
                  and node.id in checked_names
              }
              missing_imports=sorted(referenced_names-imported_names)
              assert not missing_imports, (
                  f"Python heredoc {index} references unimported names: {missing_imports}"
              )

          for index, block in enumerate(run_blocks, start=1):
              Path(f"/tmp/trusted-workflow-run-{index}.sh").write_text(textwrap.dedent(block) + "\n")
          for index in range(1, len(run_blocks) + 1):
              assert __import__("subprocess").run(
                  ["bash", "-n", f"/tmp/trusted-workflow-run-{index}.sh"],
                  capture_output=True,
                  text=True,
              ).returncode == 0, f"Bash syntax failure in run block {index}"

          ruby_blocks=[]
          i=0
          while i < len(lines):
              if re.match(r"^\s*ruby\b.*<<\x27RUBY\x27\s*$", lines[i]):
                  start=i+1
                  body=[]
                  i=start
                  while i < len(lines) and lines[i] != "          RUBY":
                      line=lines[i]
                      assert not line or line.startswith("          "), (
                          f"unexpected Ruby heredoc indentation at line {i+1}"
                      )
                      body.append(line[10:] if line else "")
                      i+=1
                  assert i < len(lines), f"unterminated Ruby heredoc at line {start}"
                  ruby_blocks.append("\n".join(body)+"\n")
              i+=1
          assert len(ruby_blocks)==1, f"unexpected Ruby heredoc count: {len(ruby_blocks)}"
          ruby_source=ruby_blocks[0]
          assert ruby_source.count('expr=lambda { |value| expr_start+" "+value+" "+expr_end }')==1
          assert ruby_source.count('expr.call("github.')==8
          assert 'expected_checkout_ref=expr_start+' not in ruby_source
          assert '"PR_NUMBER"=>expr_start+' not in ruby_source
          assert '"HEAD_SHA"=>expr_start+' not in ruby_source
          assert '"HEAD_REPO"=>expr_start+' not in ruby_source
          assert '"HEAD_BRANCH"=>expr_start+' not in ruby_source
          assert '"TRIGGER_RUN_ID"=>expr_start+' not in ruby_source
          assert '"TRIGGER_RUN_ATTEMPT"=>expr_start+' not in ruby_source
          assert '"TRIGGER_CONCLUSION"=>expr_start+' not in ruby_source
          for index, block in enumerate(ruby_blocks, start=1):
              path=Path(f"/tmp/trusted-workflow-ruby-{index}.rb")
              path.write_text(block)
              result=__import__("subprocess").run(
                  ["ruby", "-c", str(path)],
                  capture_output=True,
                  text=True,
              )
              assert result.returncode==0, f"Ruby syntax failure in heredoc {index}: {result.stderr}"
          PY

          ruby <<'RUBY'
          require "yaml"

          workflow=YAML.safe_load(File.read(".github/workflows/xen-kani-fv-002-trusted-admission.yml"), aliases: false)
          abort "workflow root must be a mapping" unless workflow.is_a?(Hash)
          top_level_keys=workflow.keys.map { |key| key == true ? "on" : key.to_s }.sort
          abort "unexpected top-level workflow keys" unless top_level_keys == ["concurrency","env","jobs","name","on","permissions"]
          abort "workflow name mismatch" unless workflow["name"] == "Trusted XEN-KANI-FV-002 Admission"
          expected_env={
            "BASE_SHA"=>"057dd03043b8863d8f8280abf333331cc9ddf317",
            "EXPECTED_HEAD_REPO"=>"Luminous-Dynamics/xenia-wire",
            "EXPECTED_HEAD_REPO_ID"=>1213976974,
            "EXPECTED_KERNEL_BLOB"=>"d1bc8a1f8fc0883856d5073fa37b1658a7ea63ad",
            "EXPECTED_PROOF_BLOB"=>"4e3f0f584ca189baafe230da66b4bdeac87a7515",
            "EXPECTED_EVIDENCE_CONTRACT_BLOB"=>"ce3e1447cc6b9bd1f0fc361b4fb81c5fe1450b0b",
            "EXPECTED_TRIGGER_WORKFLOW_ID"=>373424313,
            "EXPECTED_TRIGGER_WORKFLOW_PATH"=>".github/workflows/xen-kani-fv-002-replay-kernel-v2.yml",
            "EXPECTED_TRIGGER_WORKFLOW_BLOB"=>"44ee053e9d60779b081986769e6ff69b0c262517",
            "VERIFIER_WORKFLOW_PATH"=>".github/workflows/xen-kani-fv-002-trusted-admission.yml",
            "EXPECTED_VERIFIER_WORKFLOW_ID"=>373418900,
            "EXPECTED_TRIGGER_BRANCH"=>"formal/xen-kani-fv-002-replay-kernel",
            "EXPECTED_QUALIFIED_HEAD_SHA"=>"1fbea431db9e7e20ae3b31e925219a90de2b36bd",
            "KANI_VERSION"=>"0.68.0",
            "EXPECTED_KANI_CBMC_VERSION"=>"6.11.0",
            "EXPECTED_KANI_RELEASE_TAG"=>"kani-0.68.0",
            "EXPECTED_KANI_RELEASE_COMMIT_SHA"=>"0d2328a93f0e0ff66132d6bfa1a7d884877cf862",
            "EXPECTED_KANI_RELEASE_ASSET_ID"=>566906903,
            "EXPECTED_KANI_RELEASE_ASSET_NAME"=>"kani-0.68.0-x86_64-unknown-linux-gnu.tar.gz",
            "EXPECTED_KANI_RELEASE_ASSET_DIGEST"=>"sha256:32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3",
            "EXPECTED_KANI_CRATE_SHA256"=>"842fabd2ba8b13babab862e21fef2946b581d493f23062d5ce86266630f1d1ae",
            "EXPECTED_KANI_RUST_TOOLCHAIN"=>"nightly-2026-08-21",
            "EXPECTED_KANI_RUST_COMMIT_HASH"=>"8925ea358a0f265ca61026aadc7ecc506c545cbe",
          }
          parsed_env=workflow.fetch("env")
          abort "top-level env mismatch" unless parsed_env == expected_env
          expr_start="$"+"{{"
          expr_end="}}"
          expr=lambda { |value| expr_start+" "+value+" "+expr_end }
          expr_start="$"+"{{"
          abort "top-level env must contain no expressions" if parsed_env.values.any? { |value| value.is_a?(String) && value.include?(expr_start) }

          on_key=workflow.key?("on") ? "on" : true
          abort "missing workflow trigger map" unless workflow.key?(on_key)
          triggers=workflow.fetch(on_key)
          abort "unexpected trigger keys" unless triggers.is_a?(Hash) && triggers.keys.map(&:to_s).sort == ["pull_request","workflow_run"]

          workflow_run=triggers.fetch("workflow_run")
          abort "workflow_run trigger mismatch" unless workflow_run == {
            "workflows"=>["XEN-KANI-FV-002 Replay Kernel"],
            "types"=>["completed"],
            "branches"=>["formal/xen-kani-fv-002-replay-kernel"],
          }
