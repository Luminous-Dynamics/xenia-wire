[build]
target = "index.html"
dist = "dist"

[watch]
ignore = ["dist"]

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "for f in dist/*.wasm; do wasm-opt -Oz --zero-filled-memory --enable-bulk-memory \"$f\" -o \"$f\" 2>/dev/null || true; done"]

[serve]
address = "127.0.0.1"
# Xenia has no assigned port in the Mycelix PORTS.md registry -- it's a
# separate product, not a Mycelix cluster frontend. 8400 is in the
# project-wide "Dev/Test (ad-hoc)" range.
port = 8400
