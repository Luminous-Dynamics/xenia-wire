[package]
name = "xenia-viewer-web"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
authors = ["Tristan Stoltz <tristan.stoltz@evolvingresonantcocreationism.com>"]
license = "Apache-2.0 OR MIT"
description = "WebAssembly demo of the Xenia wire protocol — seal/open in the browser. Pre-alpha — do not use in production."
repository = "https://github.com/Luminous-Dynamics/xenia-wire"
homepage = "https://github.com/Luminous-Dynamics/xenia-wire"
readme = "README.md"
keywords = ["wasm", "xenia", "remote-desktop", "aead", "demo"]
categories = ["wasm", "cryptography"]
publish = false  # demo crate; not published to crates.io

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xenia-wire = { path = "..", version = "0.2.0-alpha.3", features = ["consent"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = { version = "0.1", optional = true }
# For decoding the daemon's RawFrame payload (shadow struct in lib.rs;
# matches xenia-peer-core's RawFrame byte-for-byte under bincode v1).
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
# Real PQC handshake (see src/handshake.rs) -- same crates/versions as
# xenia-peer's xenia-handshake crate, so the two implementations produce
# byte-identical transcripts and session keys.
ml-kem = { version = "=0.3.0-rc.2", default-features = false, features = ["zeroize", "getrandom"] }
# Same version xenia-handshake/xenia-ledger pin, so all three resolve one
# ml-dsa tree and produce byte-identical ML-DSA-65 encodings.
ml-dsa = { version = "=0.1.1", default-features = true }
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1.5"
zeroize = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
thiserror = "2"
# ml-kem's dependency chain resolves getrandom 0.3 AND 0.4 (both
# semver-incompatible with the 0.2 chain rand/ed25519-dalek use above,
# and with each other) -- each needs its own wasm feature wired
# independently for a wasm32 build to work.
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[features]
default = ["panic-hook"]
panic-hook = ["dep:console_error_panic_hook"]

[dev-dependencies]
# Dev-only: lets the cross-implementation handshake test drive a REAL
# native host side (xenia-peer-core::handshake + xenia-handshake) and
# assert byte-identical session keys against this crate's WASM-side
# reimplementation. Never compiled into the shipped wasm artifact.
xenia-peer-core = { path = "../../xenia-peer/crates/xenia-peer-core" }
xenia-handshake = { path = "../../xenia-peer/crates/xenia-handshake" }
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
